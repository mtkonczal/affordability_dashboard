  // the headline and the two badges all measure from the same point.
  const cardSince = anchorObsDate(item.data, activeId);

  // Index series always display as % change; everything else follows the
  // global $/% toggle.
  const asPct = item.rebase || displayMode === 'pct';
  const real = priceType === 'real';
  const rate = isRateSeries(item);
  const srcData = seriesForType(item, cpiData, real);

  const visibleData = sliceFrom(srcData, cardSince);
  const v0 = (asPct && visibleData.length) ? visibleData[0].value : null;
  // On a rate series the "% change" view plots the percentage-point difference
  // from the anchor, not a ratio — see the changeIn comment. The axis label
  // says which, and fmtVal keys off it for the ticks and the tooltip.
  const toPct = (data, base) => data.map(d => ({ date: d.date, value: changeIn(base, d.value, rate) ?? 0 }));
  const displayData = asPct ? toPct(visibleData, v0) : visibleData;
  const displayUnits = asPct
    ? `${rate ? 'pp' : '%'} change since ${fmtDate(visibleData[0]?.date || cardSince, { year: 'numeric', month: 'short' })}`
    : item.units;
  const headlineVal = asPct
    ? (displayData.length ? displayData[displayData.length - 1].value : 0)
    : (visibleData.length ? visibleData[visibleData.length - 1].value : item.latest_value);

  // Optional national overlay, transformed the same way (deflated too in real)
  const overlaySrc = overlayItem ? seriesForType(overlayItem, cpiData, real) : null;
  const overlayVisible = overlaySrc ? sliceFrom(overlaySrc, cardSince) : null;
  const o0 = (asPct && overlayVisible && overlayVisible.length) ? overlayVisible[0].value : null;
  const overlayDisplay = overlayVisible
    ? (asPct ? toPct(overlayVisible, o0) : overlayVisible)
    : null;

  useEffect(() => {
    loadChartJs().then(() => setChartReady(true));
  }, []);

  useEffect(() => {
    // Destroy first, and before the canvas check: when a card goes from a
    // drawable window to an empty one the canvas unmounts, and a chart left
    // attached to a detached canvas keeps its resize observer alive.
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    if (!chartReady || !canvasRef.current) return;

    const ctx = canvasRef.current.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 180);
    grad.addColorStop(0, hexToRgba(accent, 0.22));
    grad.addColorStop(0.7, hexToRgba(accent, 0.04));
    grad.addColorStop(1, hexToRgba(accent, 0));

    // Tight, round-numbered y-axis bounds across BOTH datasets. Pick a
    // "nice" step (1/2/5 × 10ⁿ) sized for the data range, then snap min/max
    // to multiples of it.
    const yVals = displayData.map(d => d.value)
      .concat(overlayDisplay ? overlayDisplay.map(d => d.value) : [])
      .filter(v => Number.isFinite(v));
    const dataMin = yVals.length ? Math.min(...yVals) : 0;
    const dataMax = yVals.length ? Math.max(...yVals) : 1;
    const dataRange = (dataMax - dataMin) || Math.max(Math.abs(dataMax), 1);
    const targetTicks = 4;
    const roughStep = dataRange / Math.max(targetTicks - 1, 1);
    const stepExp = Math.floor(Math.log10(roughStep));
    const stepFrac = roughStep / Math.pow(10, stepExp);
    const niceFrac = stepFrac < 1.5 ? 1 : stepFrac < 3 ? 2 : stepFrac < 7 ? 5 : 10;
    const yStep = niceFrac * Math.pow(10, stepExp);
    const yMin = Math.floor(dataMin / yStep) * yStep;
    const yMax = Math.ceil(dataMax / yStep) * yStep;

    // Inset the time axis ~2.5% on each side so the line's endpoints (and
    // their hover circles) sit inside the plot area instead of riding the
    // chart edge and bleeding into the axis labels.
    const ts = displayData.map(d => +new Date(d.date))
      .concat(overlayDisplay ? overlayDisplay.map(d => +new Date(d.date)) : [])
      .filter(Number.isFinite);
    const tPad = ts.length > 1
      ? Math.max((Math.max(...ts) - Math.min(...ts)) * 0.025, 86400000)
      : 86400000;
    const xMin = ts.length ? Math.min(...ts) - tPad : undefined;
    const xMax = ts.length ? Math.max(...ts) + tPad : undefined;

    const datasets = [{
      label: item.label,
      data: displayData.map(d => ({ x: d.date, y: d.value })),
      borderColor: accent,
      backgroundColor: grad,
      borderWidth: 1.8,
      pointRadius: 0,
      pointHoverRadius: 5,
      pointHoverBackgroundColor: accent,
      pointHoverBorderColor: PAPER,
      pointHoverBorderWidth: 2,
      tension: 0.32,
      fill: 'start',
      // Never draw past the plot area horizontally (the line and fill were
      // bleeding into the axis labels); endpoints stay clear of the edges
      // via the x-axis inset above. Small top allowance keeps hover circles
      // at the series max from being cut.
      clip: { left: 0, right: 0, top: 12, bottom: 0 },
    }];
    if (overlayDisplay && overlayDisplay.length) {
      datasets.push({
        label: 'US average',
        data: overlayDisplay.map(d => ({ x: d.date, y: d.value })),
        borderColor: hexToRgba(NAVY, 0.65),
        borderWidth: 1.4,
        borderDash: [5, 4],
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.32,
        fill: false,
        clip: { left: 0, right: 0, top: 12, bottom: 0 },
      });
    }

    chartRef.current = new window.Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8 } },
        animation: { duration: 350, easing: 'easeOutQuart' },
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: NAVY,
            titleColor: '#9BA8C2',
            bodyColor: PAPER,
            borderColor: 'rgba(244,242,228,.15)',
            borderWidth: 1,
            padding: 11,
            cornerRadius: 4,
            displayColors: false,
            titleFont: { size: 10, family: 'Public Sans, system-ui', weight: '600' },
            bodyFont:  { size: 13, family: 'Public Sans, system-ui', weight: '600' },
            callbacks: {
              title: (c) => fmtObsDate(c[0].parsed.x, item.data, { year: 'numeric', month: 'long' }),
              label: (c) => `  ${datasets.length > 1 ? c.dataset.label + ': ' : ''}` + fmtVal(c.parsed.y, displayUnits),
            },
          },
        },
        scales: {
          x: {
            type: 'time',
            min: xMin,
            max: xMax,
            time: { unit: activeId === '1y' ? 'month' : 'year' },
            grid: { display: false },
            border: { display: false },
            ticks: {
              color: MUTE,
              font: { size: 10, family: 'Public Sans, system-ui' },
              maxTicksLimit: activeId === '1y' ? 6 : 5,
            },
          },
          y: {
            position: 'right',
            min: yMin,
            max: yMax,
            grid: { color: 'rgba(44,50,84,.08)', drawTicks: false },
            border: { display: false },
            ticks: {
              color: MUTE,
              font: { size: 10, family: 'Public Sans, system-ui' },
              stepSize: yStep,
              callback: (v) => fmtVal(v, displayUnits),
            },
          },
        },
      },
    });

    return () => {
      if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    };
  }, [chartReady, item, cardSince, accent, displayMode, priceType, overlayItem]);

  let change = changeSince(srcData, cardSince, item);
  // If the anchor predates this series (e.g. a global "since 2000" or a custom
  // 2000 on a series that only starts in 2006), changeSince finds no reading
  // at/before the anchor and returns null. Fall back to the change since the
  // earliest available reading — the same base the chart draws from — instead
  // of showing a misleading 0.0%. When we clamp, remember the true start so the
  // label reads "since Mar 2006", not "since 2000".
  let clampedStart = null;
  if (change == null && visibleData.length >= 2) {
    const clamped = changeIn(visibleData[0].value, visibleData[visibleData.length - 1].value, rate);
    if (clamped != null) {
      change = clamped;
      clampedStart = visibleData[0].date;
    }
  }
  const activePhrase = clampedStart ? 'since ' + fmtDate(clampedStart) : active.phrase;
  // change is still null here only when the active anchor is on/after the
  // series' actual last reading (e.g. an annual series with nothing
  // published since the anchor) — the clamp above only recovers the
  // opposite case (anchor predates the series).
  const isStale = change == null;
  const up = change != null && change >= 0;
  const bad = item.invert_color ? !up : up;
  const changeColorFor = (v) => (item.invert_color ? v < 0 : v >= 0) ? WARM_RED : '#2E7D5B';
  const latestDate = srcData.length ? srcData[srcData.length - 1].date : null;

  // The two message anchors, always visible regardless of the active range.
  // Percentage points on a rate series, the same as the picker row and the
  // Copy-fact sentence — a card must not answer one way when read and another
  // when quoted.
  const b25 = changeSince(srcData, '2025-01-01', item);
  const b19 = changeSince(srcData, '2019-12-01', item);
  const badge = (v, lbl) => v == null ? null : (
    <span key={lbl} style={{ whiteSpace: 'nowrap' }}>
      <span style={{ color: MUTE }}>{lbl} </span>
      <span style={{ color: changeColorFor(v), fontWeight: 700 }}>
        {fmtChange(v, rate)}
      </span>
    </span>
  );
  // b25 nulls out for the same reason a card can go isStale: this series
  // (typically an annual Census/KFF one) hasn't published a reading past
  // Jan 2025 yet. Say so instead of just dropping the badge silently.
  const staleNote25raw = (b25 == null && latestDate) ? `Data through ${fmtObsDate(latestDate, srcData)}` : null;

  // Nothing to plot in this window — one reading (or none) under a full y-axis
  // reads as a broken chart, so the canvas is replaced by a blank panel that
  // names the gap.
  const emptyNote = emptyWindowNote(srcData, visibleData, activeId);

  // In % mode an empty window rebases its one reading against itself and the
  // headline comes out "+0.0%" — an unchanged-since claim, right beside a note
  // saying there's been no reading at all. Print a dash instead. In $ mode the
  // headline is that last reading's actual level, which is true, so it stands.
  const headlineText = asPct
    ? (emptyNote ? '—' : fmtChange(headlineVal, rate))
    : fmtVal(headlineVal, displayUnits);
  const changeText = isStale
    ? (latestDate ? `Data through ${fmtObsDate(latestDate, srcData)}` : 'No data')
    : asPct
      ? (up ? '↑ ' : '↓ ') + activePhrase
      : (up ? '↑ +' : '↓ ') + Math.abs(change || 0).toFixed(1) + (rate ? ' pp ' : '% ') + activePhrase;
  // The Jan-2025 badge slot and the headline note say the identical sentence
  // whenever the active anchor IS Jan 2025 and the series stops before it, so
  // the card printed "Data through 2024" twice. Keep the headline's copy.
  const staleNote25 = staleNote25raw === changeText ? null : staleNote25raw;

  return (
    <div ref={cardRef} style={{
      background: 'transparent',
      padding: '18px 22px 16px',
      display: 'flex', flexDirection: 'column', gap: 12,
    }}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{
            fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
            fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase',
            fontWeight: 700, color: accent, marginBottom: 4,
          }}>{item.eyebrow || categoryLabel(item.category)}</div>
          <div style={{
            fontFamily: 'Publico, Georgia, serif',
            fontSize: 20, fontWeight: 500, lineHeight: 1.15, color: INK,
          }}>{item.label}</div>
          <div style={{
            fontSize: 12, color: MUTE, marginTop: 3,
            fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic',
          }}>{item.subtitle}</div>
        </div>
        <div style={{ textAlign: 'right', flexShrink: 0 }}>
          <div style={{
            fontFamily: 'Publico, Georgia, serif',
            fontSize: 28, fontWeight: 500, lineHeight: 1, color: INK,
          }}>{headlineText}</div>
          <div style={{
            fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
            fontSize: 11, fontWeight: 700, marginTop: 6,
            color: isStale ? MUTE : (bad ? WARM_RED : '#2E7D5B'),
          }}>{changeText}</div>
        </div>
      </div>

      {/* Dual anchor badges — the two numbers a press release needs — plus
          the state's national rank when this is a state metric */}
      {(b25 != null || b19 != null || staleNote25 || rankNote) && (
        <div style={{
          fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
          fontSize: 11, display: 'flex', gap: 14, flexWrap: 'wrap',
          padding: '7px 10px', background: hexToRgba(NAVY, 0.045),
          border: `1px solid rgba(44,50,84,.08)`, borderRadius: 4,
        }}>
          {badge(b25, "Since Jan '25")}
          {staleNote25 && (
            <span style={{ whiteSpace: 'nowrap', color: MUTE, fontStyle: 'italic' }}>{staleNote25}</span>
          )}
          {badge(b19, "Since Dec '19")}
          {rankNote && (
            <span style={{ whiteSpace: 'nowrap' }}>
              <span style={{ color: MUTE }}>Rank </span>
              <span style={{ color: NAVY, fontWeight: 700 }}>{rankNote}</span>
            </span>
          )}
        </div>
      )}

      {/* Range buttons */}
      <div className="at-range-row" style={{
        display: 'flex', gap: 4, alignItems: 'center',
        margin: '2px 0 -4px',
      }}>
        {ANCHORS.map(r => {
          const on = r.id === activeId;
          return (
            <button
              key={r.id}
              onClick={() => setOvr(r.id)}
              title={r.title}
              style={{
                fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
                fontSize: 10, fontWeight: 600, letterSpacing: '.05em',
                background: on ? NAVY : 'transparent',
                color: on ? PAPER : NAVY,
                border: `1px solid ${NAVY}`,
                padding: '3px 9px', borderRadius: 3,
                cursor: 'pointer',
                transition: 'all .12s',
              }}
            >{r.label}</button>
          );
        })}
      </div>

      {/* Chart — or, when the active window holds nothing to plot, a blank
          panel instead of one point under a full y-axis */}
      <div style={{ height: 240, position: 'relative' }}>
        {emptyNote ? (
          <div style={{
            height: '100%', display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center', gap: 6,
            textAlign: 'center', padding: '0 18px',
            border: `1px dashed rgba(44,50,84,.22)`, borderRadius: 4,
            background: hexToRgba(NAVY, 0.02),
          }}>
            <div style={{
              fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
              fontSize: 12, fontWeight: 700, letterSpacing: '.06em',
              textTransform: 'uppercase', color: MUTE,
            }}>{emptyNote.head}</div>
            <div style={{
              fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic',
              fontSize: 13, color: SOFT, maxWidth: 300, lineHeight: 1.45,
            }}>{emptyNote.sub}</div>
          </div>
        ) : (
          <canvas ref={canvasRef} />
        )}
      </div>
      {overlayItem && !emptyNote && (
        <div style={{
          fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
          fontSize: 10, color: MUTE, marginTop: -6,
        }}>
          <span style={{ borderBottom: `2px dashed ${hexToRgba(NAVY, 0.65)}`, paddingBottom: 1 }}>– –</span> US average
        </div>
      )}

      {/* Footer */}
      <div style={{
        fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
        fontSize: 9, color: SOFT, letterSpacing: '.1em',
        textTransform: 'uppercase',
        paddingTop: 8, borderTop: `1px solid rgba(44,50,84,.1)`,
        display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12,
      }}>
        {(() => {
          // Every card links back to a source document: the FRED series page
          // when we have a FRED ID, otherwise the series' source_url (KFF,
          // NY Fed, Zillow, Census, EIA — or about.html for derived series).
          const srcUrl = item.fred_id
            ? `https://fred.stlouisfed.org/series/${item.fred_id}`
            : item.source_url;
          const srcLabel = item.fred_id
            ? `Source · FRED · ${item.fred_id}`
            : `Source · ${item.source_note || 'View source'}`;
          return srcUrl ? (
            <a
              href={srcUrl}
              target="_blank"
              rel="noopener noreferrer"
              onClick={handleSourceLinkClick}
              style={{ color: SOFT, textDecoration: 'none', borderBottom: '1px dotted rgba(44,50,84,.3)' }}
              onMouseEnter={(e) => { e.currentTarget.style.color = NAVY; }}
              onMouseLeave={(e) => { e.currentTarget.style.color = SOFT; }}
            >
              {srcLabel} ↗
            </a>
          ) : (
            <span>{item.source_note || 'Derived from public data'}</span>
          );
        })()}
        <span style={{ display: 'flex', gap: 8, alignItems: 'center' }} data-export-hide>
          <CopyFactButton item={item} factLabel={factLabel} priceType={priceType} cpiData={cpiData} rankText={rankText}
                          anchorId={activeId} since={cardSince} />
          <button
            onClick={() => downloadCSV(item)}
            style={styles.smallBtn}
            onMouseEnter={(e) => { e.currentTarget.style.background = NAVY; e.currentTarget.style.color = PAPER; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = NAVY; }}
          >↓ CSV</button>
          <button
            onClick={async () => {
              const chartCanvas = cardRef.current?.querySelector('canvas');
              const changeColor = bad ? WARM_RED : '#2E7D5B';
              try {
                await downloadCardAsPNG({
                  chartCanvas, item, accent,
                  headlineText, changeText, changeColor, rangeLabel: activePhrase,
                });
              } catch (err) { console.error('PNG export failed', err); }
            }}
            style={styles.smallBtn}
            onMouseEnter={(e) => { e.currentTarget.style.background = NAVY; e.currentTarget.style.color = PAPER; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = NAVY; }}
          >↓ PNG</button>
        </span>
      </div>
    </div>
  );
}

// ── YoY heatmap with cumulative anchor columns ──────────────────────────────
function Heatmap({ items, priceType, cpiData }) {
  const years = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
  const real = priceType === 'real';

  // Rate rows are in percentage points, everything else in percent — the same
  // rule the cards and the picker follow. The colour ramp is shared, so a rate
  // row now reads pale (a 0.6 pp move is a 0.6 on a ±15 scale); that is the
  // honest weight for it, where the old percent-of-a-percent inflated it.
  const matrix = items.map(item => {
    const d = seriesForType(item, cpiData, real);
    return {
      item,
      rate: isRateSeries(item),
      cells: years.map(yr => changeBetween(d, `${yr - 1}-01-15`, `${yr}-01-15`, item)),
      cum19: changeSince(d, '2019-12-01', item),
      cum25: changeSince(d, '2025-01-01', item),
    };
  });

  const colorScaled = (v, span) => {
    if (v == null) return BEIGE;
    const clamp = Math.max(-span, Math.min(span, v));
    const a = Math.abs(clamp) / span;
    const lerp = (s, e) => Math.round(s + (e - s) * a);
    if (clamp > 0) return `rgb(${lerp(244, 224)},${lerp(236, 78)},${lerp(216, 57)})`;
    return `rgb(${lerp(244, 46)},${lerp(236, 125)},${lerp(216, 91)})`;
  };
  const color = (v) => colorScaled(v, 15);
  // Cumulative columns cover 6+ years of change; a wider clamp keeps them
  // from saturating uniformly red.
  const colorCum = (v) => colorScaled(v, 40);
  const textColor = (v, span = 15) => v == null ? MUTE : (Math.abs(v) > span * 0.47 ? PAPER : INK);

  if (!items.length) {
    return (
      <div style={{
        background: SURFACE, border: `1px solid rgba(44,50,84,.18)`,
        padding: '32px', textAlign: 'center',
        fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE,
      }}>
        Select at least one metric above to see the year-by-year breakdown.
      </div>
    );
  }

  const cumHeader = {
    textAlign: 'center', fontSize: 10, lineHeight: 1.25,
    fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
    fontWeight: 700, color: WARM_RED, padding: '0 0 6px',
    textTransform: 'uppercase', letterSpacing: '.04em',
  };
  const cumCell = { borderLeft: `2px solid ${BEIGE}` };

  return (
    <div style={{ background: SURFACE, border: `1px solid rgba(44,50,84,.18)`, padding: '24px' }}>
      <div style={{
        display: 'flex', justifyContent: 'flex-end', alignItems: 'center', gap: 8,
        fontSize: 10, color: MUTE, marginBottom: 14,
        fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', letterSpacing: '.1em',
      }}>
        <span>−15%</span>
        <div style={{ width: 120, height: 10,
          background: `linear-gradient(90deg, ${color(-15)}, ${color(0)}, ${color(15)})` }} />
        <span>+15%</span>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: `220px repeat(${years.length}, 1fr) 14px 1.35fr 1.35fr`, gap: 2 }}>
        <div></div>
        {years.map(yr => (
          <div key={yr} style={{
            textAlign: 'center', fontSize: 11,
            fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
            fontWeight: 700, color: INK, padding: '0 0 6px',
          }}>{yr}</div>
        ))}
        <div></div>
        <div style={cumHeader}>Since<br/>Dec '19</div>
        <div style={cumHeader}>Since<br/>Jan '25</div>
        {matrix.map(row => (
          <React.Fragment key={row.item.id}>
            <div style={{
              padding: '12px 8px', fontSize: 13, fontWeight: 600, color: INK,
              fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
            }}>
              {row.item.label}
              <div style={{ fontSize: 10, color: MUTE, fontWeight: 400, marginTop: 2 }}>
                {row.item.subtitle}
                {row.rate && <span style={{ fontStyle: 'italic' }}> · in percentage points</span>}
              </div>
            </div>
            {row.cells.map((v, i) => (
              <div key={i} style={{
                background: color(v), color: textColor(v),
                padding: '12px 4px', textAlign: 'center',
                fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
                fontSize: 13, fontWeight: 700,
              }}>
                {v == null ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(1)}`}
              </div>
            ))}
            <div></div>
            {[row.cum19, row.cum25].map((v, i) => (
              <div key={'c' + i} style={{
                background: colorCum(v), color: textColor(v, 40),
                padding: '12px 4px', textAlign: 'center',
                fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
                fontSize: 13, fontWeight: 700, ...cumCell,
              }}>
                {v == null ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(1)}${row.rate ? ' pp' : '%'}`}
              </div>
            ))}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

// ── National view ────────────────────────────────────────────────────────────
// Default card set (comms request, August 2026): a cross-category headline mix
// rather than one whole category, ending on headline CPI so the individual
// prices above it add up to the overall number.
// This list is ORDERED — it is the first paint's card order top to bottom, not
// just a membership set, so taxonomy order does not reshuffle it. Everything
// after first paint follows the usual newest-added-first rule.
const DEFAULT_NATIONAL_IDS = [
  'electricity', 'gas', 'aca_benchmark_premium', 'zori_rent',
  'mortgage', 'coffee', 'ground_beef', 'cpi_all_items',
];
// One list of rows, rendered into either container: a rail above the 1060px
// breakpoint, a menu below it. Selection, filter text and group state all live
// in the view, so these are two views of one picker rather than two pickers
// that have to be kept in sync.
//
// All four tabs use it. `mode` is the only thing that varies, because the four
// views don't all mean the same thing by "picked":
//
//   'multi'    National, My State — add and remove freely, down to nothing.
//              Group headers bulk-toggle; Select all and Clear both apply.
//   'keep-one' Compare States — same, except a panel-less Compare has nothing
//              to show, so the last metric can't be removed. Clear is therefore
//              absent (there is no valid empty state to clear to) and so is
//              Select all: one click would open 14 panels, each lazy-loading a
//              51-state payload and drawing a chart. Group headers stay — that
//              caps at seven and it's the documented comms request.
//   'single'   Map — the choropleth paints one measure at a time. Rows are
//              radio marks (● / ○), not ✓ / ＋: a plus would say "add another",
//              which this tab cannot do. Group headers are plain labels rather
//              than bulk toggles, for the same reason, and the head is just the
//              filter — "1 of 13 on" says nothing when only 1 is ever possible.
//
// The row itself, the CSS and the two containers are identical in every mode.
function MetricPicker({
  variant, groups, selectedIds, total, q, setQ,
  toggleId, toggleCategory, catState, onSelectAll, onClearAll,
  anchorId, priceType, cpiData, mode = 'multi', menuLabel = 'Add a metric',
}) {
  const [open, setOpen] = useState(false);
  const needle = q.trim().toLowerCase();
  const single = mode === 'single';

  // Filtering hides rows from the list only. Charts already on the page are
  // never touched and the selection is never cleared — typing "egg" while
  // seven charts are up must not imply those seven have gone away.
  const rows = groups.map(g => {
    const items = needle ? g.items.filter(i => i.label.toLowerCase().includes(needle)) : g.items;
    if (!items.length) return null;
    const state = single ? 'none' : catState(g.id);
    return (
      <React.Fragment key={g.id}>
        {single ? (
          // Same type, no hit area: on a one-at-a-time tab a clickable heading
          // could only ever promise something the view can't do.
          <div className="at-grp as-label">{g.label}</div>
        ) : (
          <button
            className={`at-grp${state === 'none' ? '' : ' on'}`}
            onClick={() => toggleCategory(g.id)}
            title={state === 'all'
              ? `Remove all ${g.items.length} metrics in ${g.label}`
              : `Add all ${g.items.length} metrics in ${g.label}`}
          >{g.label}</button>
        )}
        {items.map(item => {
          const on = selectedIds.has(item.id);
          return (
            <button key={item.id} className={`at-prow${on ? ' on' : ''}`}
                    onClick={() => toggleId(item.id)}
                    role={single ? 'radio' : undefined}
                    aria-checked={single ? on : undefined}
                    aria-pressed={single ? undefined : on}>
              <span className="at-prow-mark" aria-hidden="true">
                {single ? (on ? '●' : '○') : (on ? '✓' : '＋')}
              </span>
              <span className="at-prow-name">{item.label}</span>
              <span className="at-prow-ch">{railChangeText(item, anchorId, priceType, cpiData)}</span>
            </button>
          );
        })}
      </React.Fragment>
    );
  }).filter(Boolean);

  const list = (
    <div className="at-plist" role={single ? 'radiogroup' : undefined}
         aria-label={single ? 'Measure' : undefined}>
      {rows.length ? rows : (
        <div className="at-pstub">
          No metrics match “{q.trim()}”.{' '}
          <button className="at-plnk" onClick={() => setQ('')}>Clear filter</button>
        </div>
      )}
    </div>
  );

  const head = (
    <React.Fragment>
      <input className="at-pfilter" value={q} onChange={e => setQ(e.target.value)}
             placeholder={`Filter ${total} ${single ? 'measures' : 'metrics'}…`}
             aria-label="Filter metrics" autoComplete="off" />
      {!single && (
        <div className="at-phead">
          <span className="at-pcount">{selectedIds.size} of {total} on</span>
          {onSelectAll && <button className="at-plnk" onClick={onSelectAll}>Select all</button>}
          {onClearAll && <button className="at-plnk" onClick={onClearAll}>Clear</button>}
        </div>
      )}
    </React.Fragment>
  );

  if (variant === 'rail') return <div>{head}{list}</div>;

  // The menu keeps the transparent button in both states and changes its label
  // rather than filling navy when open — an open menu is not a selected state.
  // Collapsed, the summary beside it has to carry what the list would have said:
  // a count where several can be on, the chosen one's name where only one can.
  const selectedLabel = single
    ? (groups.flatMap(g => g.items).find(i => selectedIds.has(i.id)) || {}).label
    : null;
  return (
    <div>
      <div className="at-menubar">
        <button onClick={() => setOpen(!open)} aria-expanded={open}
                style={{ ...styles.smallBtn, fontSize: 11, padding: '6px 12px' }}>
          {open ? 'Hide the list' : `${menuLabel} ▾`}
        </button>
        <span className="at-pcount">
          {single ? (selectedLabel || '') : `${selectedIds.size} of ${total} on`}
        </span>
      </div>
      {open && <div className="at-menupop">{head}{list}</div>}
    </div>
  );
}

function NationalView({ data, anchorId, displayMode, priceType }) {
  const cpiData = data.cpi_all_items ? data.cpi_all_items.data : null;
  const allItems = useMemo(
    () => Object.values(data).filter(i => !i.overlay_only),
    [data]
  );

  // Groups in CATEGORY_META order — editorial, biggest household line first,
  // headline CPI last. Metrics stay strictly alphabetical inside each group;
  // the comms alphabetical rule was reversed at the group level only.
  const groups = useMemo(() => CATEGORY_META
    .map(c => ({
      id: c.id,
      label: c.label,
      items: allItems
        .filter(i => i.category === c.id)
        .sort((a, b) => a.label.localeCompare(b.label)),
    }))
    .filter(g => g.items.length), [allItems]);

  // The selection is an ORDER, newest first — see selAdd/selRemove. The Set
  // below is derived from it for the picker's marks and counts.
  const [selOrder, setSelOrder] = useState(() => {
    // Intersect with what's actually in the payload, so a renamed or dropped
    // series can't leave a phantom selection — but keep DEFAULT_NATIONAL_IDS'
    // own order, which is the editorial card order for the opening page.
    // (It used to read off `groups` and land in taxonomy order; the default
    // set is now sequenced deliberately, so the list wins.) Nothing has been
    // "most recently added" on first paint, so no reversal here either.
    const have = new Set(groups.flatMap(g => g.items.map(i => i.id)));
    return DEFAULT_NATIONAL_IDS.filter(id => have.has(id));
  });
  const selectedIds = useMemo(() => new Set(selOrder), [selOrder]);
  // Shared by both containers, so a filter typed in the rail survives a resize
  // into the menu.
  const [q, setQ] = useState('');

  const toggleId = (id) => {
    setSelOrder(prev => prev.includes(id) ? selRemove(prev, id) : selAdd(prev, id));
  };

  const itemsIn = (catId) => {
    const g = groups.find(x => x.id === catId);
    return g ? g.items : [];
  };
  // Group headers are additive bulk toggles: adding a group never touches
  // what's selected elsewhere — the comms team's "let me throw groceries in
  // with Big Ticket" request, carried over from the chip picker this replaces.
  const catState = (catId) => {
    const items = itemsIn(catId);
    const on = items.filter(i => selectedIds.has(i.id)).length;
    return on === 0 ? 'none' : on === items.length ? 'all' : 'some';
  };
  const toggleCategory = (catId) => {
    const ids = itemsIn(catId).map(i => i.id);
    const removing = catState(catId) === 'all';
    setSelOrder(prev => removing ? selRemove(prev, ids) : selAdd(prev, ids));
  };

  // Cards render newest-added first. `selOrder` is already that order; map it
  // back through the payload and drop anything the data no longer has.
  const byId = useMemo(() => {
    const m = {};
    allItems.forEach(i => { m[i.id] = i; });
    return m;
  }, [allItems]);
  const selectedItems = selOrder.map(id => byId[id]).filter(Boolean);
  const anchor = anchorById(anchorId);

  const picker = (variant) => (
    <MetricPicker
      variant={variant} groups={groups} selectedIds={selectedIds} total={allItems.length}
      q={q} setQ={setQ}
      toggleId={toggleId} toggleCategory={toggleCategory} catState={catState}
      // Select all is the one case with no "most recent": lay the whole catalog
      // out in taxonomy order rather than in whatever order Object.values gave.
      onSelectAll={() => setSelOrder(groups.flatMap(g => g.items.map(i => i.id)))}
      onClearAll={() => setSelOrder([])}
      anchorId={anchorId} priceType={priceType} cpiData={cpiData}
    />
  );

  return (
    <div className="at-pad" style={{ padding: '20px 56px 56px' }}>
      {/* Both containers are always rendered; CSS decides which one is visible
          at the current width. They share one selection and one filter string,
          so crossing the breakpoint never loses state. */}
      <div className="at-nat-layout">
        <div className="at-rail">{picker('rail')}</div>

        <div style={{ minWidth: 0 }}>
          <div className="at-natmenu">{picker('menu')}</div>

          <div className="at-section-head" style={styles.sectionHead}>
            <span style={styles.sectionTitle}>
              {selectedItems.length === 0
                ? 'Nothing selected'
                : selectedItems.length === 1
                  ? selectedItems[0].label
                  : `${selectedItems.length} metrics, ${anchor.phrase}`}
            </span>
            <span className="at-section-dek" style={styles.sectionDek}>Hover any chart for monthly values.</span>
          </div>

          {selectedItems.length === 0 ? (
            <div style={{
              background: SURFACE, border: `1px solid rgba(44,50,84,.18)`,
              padding: '48px 32px', textAlign: 'center',
              fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE,
            }}>
              Pick a metric from the list to chart it.
            </div>
          ) : (
            <div className="at-cards-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: 0,
              border: `1px solid rgba(44,50,84,.14)`, background: SURFACE }}>
              {selectedItems.map((item, i) => {
                const col = i % 2;
                const row = Math.floor(i / 2);
                const total = selectedItems.length;
                const lastRow = Math.floor((total - 1) / 2);
                return (
                  <div key={item.id} className="at-card" style={{
                    borderRight: col < 1 ? `1px solid rgba(44,50,84,.14)` : 'none',
                    borderBottom: row < lastRow ? `1px solid rgba(44,50,84,.14)` : 'none',
                  }}>
                    <ChartCard item={item} anchorId={anchorId} displayMode={displayMode}
                               priceType={priceType} cpiData={cpiData} />
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      <div className="at-section-head" style={{ ...styles.sectionHead, marginTop: 48 }}>
        <span style={styles.sectionTitle}>Year by year</span>
        <span className="at-section-dek" style={styles.sectionDek}>Year-over-year change each January, plus the two anchors, for the metrics you've selected. Rate series are in percentage points.</span>
      </div>
      <div className="at-heatmap-scroll">
        <Heatmap items={selectedItems} priceType={priceType} cpiData={cpiData} />
      </div>
    </div>
  );
}

// ── State view: metrics for one state, each vs. the US ──────────────────────
// Carries the same picker as the National view (August 2026): one MetricPicker
// in two containers, a 220px rail above 1060px and a menu below it, one
// selection shared between them. Three things differ from National, all
// deliberate:
//
//   · It defaults to four metrics on — electricity bill, market rent, the ACA
//     benchmark premium, and real median household income (`STATE_DEFAULT_METRICS`,
//     below) — rather than every metric, so a reader who never touches the rail
//     sees a page, not all ~14 cards at once.
//   · Selection is keyed on the bare metric id, not the per-state card id, so
//     stepping through states with ← → keeps it. A metric the next state lacks
//     (rent, in the states under 50% ZORI renter coverage) is simply not listed.
//   · Only three of the six groups can appear. "groceries" has no state data
//     and "overall" is impossible — there is no state CPI — while "bills" is
//     folded into housing in the data, since a group heading over one lone
//     electricity bill reads like a bug. See the STATE_METRICS comment in
//     fetch_data.R; the fold lives there, not here, so the rail heading, the
//     card order and the color family cannot disagree.
function fmtAnnual(value, units) {
  if ((units || '').includes('%')) return Number(value).toFixed(1) + '%';
  if ((units || '').includes('$')) return '$' + Math.round(Number(value)).toLocaleString();
  return Number(value).toLocaleString();
}

function StateView({ data, code, setCode, anchorId, displayMode, priceType }) {
  const cpiData = data.cpi_all_items ? data.cpi_all_items.data : null;
  const idx = window.AFFORDABILITY_STATES;
  const isUS = code === 'US';
  const [status, setStatus] = useState('loading');

  // Four metrics on to start (see the note above). Keyed on the catalog id, so
  // the order is meaningful for every state, not just the one on screen — and
  // it is an ORDER, newest added first, the same rule the National grid uses.
  const [selOrder, setSelOrder] = useState(STATE_DEFAULT_METRICS);
  const selectedIds = useMemo(() => new Set(selOrder), [selOrder]);
  // One filter string across both containers, so typing in the rail survives a
  // resize into the menu.
  const [q, setQ] = useState('');

  useEffect(() => {
    let live = true;
    if (code === 'US') { setStatus('ready'); return; } // national data is already loaded
    setStatus('loading');
    loadDataFile(`data/states/${code.toLowerCase()}.js`)
      .then(() => { if (live) setStatus('ready'); })
      .catch(() => { if (live) setStatus('error'); });
    return () => { live = false; };
  }, [code]);

  // "United States" is just another option in the picker (comms request) —
  // its metric series come from the already-loaded national payload.
  const stateList = idx ? [{ code: 'US', name: 'United States' }, ...idx.states] : [];
  const pos = stateList.findIndex(s => s.code === code);
  const step = (d) => {
    const n = stateList[(pos + d + stateList.length) % stateList.length];
    if (n) setCode(n.code);
  };

  const sd = isUS
    ? (() => {
        const metrics = {};
        idx && idx.metrics.forEach(m => {
          const nat = m.national_id && data[m.national_id];
          if (nat) metrics[m.id] = {
            fred_id: nat.fred_id, latest_value: nat.latest_value,
            latest_date: nat.latest_date, data: nat.data,
          };
        });
        return { name: 'United States', metrics, annual: {} };
      })()
    : ((status === 'ready' && window.STATE_DATA) ? window.STATE_DATA[code] : null);

  // The which-state bar. Distinct from the metric picker below it, which is why
  // it isn't called `picker` any more.
  const stateBar = (
    <div className="at-pad at-inset-rule" style={{
      background: MENU_BG,
      padding: '16px 56px',
      display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap',
    }}>
      <span style={styles.controlLabel}>State</span>
      <button onClick={() => step(-1)} style={{ ...styles.smallBtn, padding: '8px 10px', fontSize: 12 }}>←</button>
      <select value={code} onChange={(e) => setCode(e.target.value)} style={styles.select}>
        {stateList.map(s => <option key={s.code} value={s.code}>{s.name}</option>)}
      </select>
      <button onClick={() => step(1)} style={{ ...styles.smallBtn, padding: '8px 10px', fontSize: 12 }}>→</button>
      <span style={{
        fontFamily: 'Publico, Georgia, serif', fontSize: 13, fontStyle: 'italic', color: MUTE,
      }}>Pick a state — or United States — to see every metric we track for it.</span>
    </div>
  );

  if (!idx) return null;
  if (status !== 'ready' || !sd) {
    return (
      <React.Fragment>
        {stateBar}
        <div className="at-pad" style={{ padding: '48px 56px', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
          {status === 'error' ? `Could not load data for ${code}.` : 'Loading state data…'}
        </div>
      </React.Fragment>
    );
  }

  // Every metric this state actually has. No sort here: the groups below order
  // them, group order first and alphabetical inside each group — the same rule
  // the National view follows, and the reason the flat alphabetical sort that
  // used to live on this line is gone. Metrics stay strictly alphabetical
  // within a group, which is where the comms alphabetical rule applies.
  const cards = idx.metrics
    .filter(m => sd.metrics && sd.metrics[m.id])
    .map(m => {
      const sm = sd.metrics[m.id];
      const coverageNote = sm.coverage && sm.coverage < 1
        ? ` · covers ${(sm.coverage * 100).toFixed(0)}% of renters`
        : '';
      const item = {
        id: `${code.toLowerCase()}_${m.id}`,
        label: m.label,
        eyebrow: sd.name,
        subtitle: `${m.source_label}${coverageNote}`,
        // The real category, not the old 'state' placeholder: espColorFor reads
        // it, so this is what puts the state cards on the ESP palette. The card
        // eyebrow is unaffected — it prints `eyebrow` (the state name) and only
        // falls back to the category label when there is none.
        category: m.category,
        units: m.units,
        description: m.description,
        color: m.color,
        fred_id: sm.fred_id,
        source_note: m.source_label,
        source_url: m.source_url,
        rebase: m.rebase,
        invert_color: m.invert_color,
        already_real: ALREADY_REAL_IDS.has(m.id),
        latest_value: sm.latest_value,
        latest_date: sm.latest_date,
        data: sm.data,
      };
      // Build-time national rank (1 = highest value), baked into the payload
      // by fetch_data.R. "Highest" is direction-neutral phrasing: highest
      // rent is bad, highest income is good — the color badges say which.
      const rankNote = sm.rank != null && sm.rank_n != null
        ? `${ordinal(sm.rank)} highest of ${sm.rank_n}` : null;
      const rankText = sm.rank != null && sm.rank_n != null
        ? `the ${ordinal(sm.rank)} highest among ${sm.rank_n} states` : null;
      return { metric: m, item, factLabel: `${sd.name} — ${m.label}`, rankNote, rankText };
    });

  // Groups in CATEGORY_META order, alphabetical within each. Empty groups drop
  // out, which is what leaves the state tabs with three of the six rather than
  // printing "Food" over nothing.
  const groups = CATEGORY_META
    .map(c => ({
      id: c.id,
      label: c.label,
      cards: cards
        .filter(x => x.metric.category === c.id)
        .sort((a, b) => a.metric.label.localeCompare(b.metric.label)),
    }))
    .filter(g => g.cards.length);

  // What MetricPicker wants: {id, label, items}. The rows key on the catalog id
  // (`rent`), not the card id (`il_rent`), so a selection survives a change of
  // state; everything else on the item is what railChangeText reads.
  const pickerGroups = groups.map(g => ({
    id: g.id,
    label: g.label,
    items: g.cards.map(c => ({ ...c.item, id: c.metric.id })),
  }));

  const toggleId = (id) => {
    setSelOrder(prev => prev.includes(id) ? selRemove(prev, id) : selAdd(prev, id));
  };
  const idsIn = (catId) => {
    const g = groups.find(x => x.id === catId);
    return g ? g.cards.map(c => c.metric.id) : [];
  };
  // Additive bulk toggles, same as National: adding a group never touches what
  // is selected elsewhere. The count is over what this state actually has, so a
  // group reads "all on" when every metric present is on, not when a metric the
  // state doesn't publish is missing from the set.
  const catState = (catId) => {
    const ids = idsIn(catId);
    const on = ids.filter(id => selectedIds.has(id)).length;
    return on === 0 ? 'none' : on === ids.length ? 'all' : 'some';
  };
  const toggleCategory = (catId) => {
    const ids = idsIn(catId);
    const removing = catState(catId) === 'all';
    setSelOrder(prev => removing ? selRemove(prev, ids) : selAdd(prev, ids));
  };

  // Newest-added first, the same rule as National. selOrder holds catalog ids
  // for the whole catalog; map back through this state's cards, which drops the
  // metrics this state doesn't publish.
  //
  // Deliberately not a useMemo: everything from here down runs after the
  // loading/error early return above, so a hook here changes the hook order
  // between renders. `cards` is 14 items.
  const cardByMetric = {};
  cards.forEach(c => { cardByMetric[c.metric.id] = c; });
  const selectedCards = selOrder.map(id => cardByMetric[id]).filter(Boolean);

  const metricPicker = (variant) => (
    <MetricPicker
      variant={variant} groups={pickerGroups} total={cards.length}
      // The picker counts and marks against what this state has, so "12 of 12
      // on" can't be contradicted by a card that isn't there.
      selectedIds={new Set(selectedCards.map(c => c.metric.id))}
      q={q} setQ={setQ}
      toggleId={toggleId} toggleCategory={toggleCategory} catState={catState}
      // Select all covers the whole catalog, not just this state's metrics, so
      // it doesn't quietly drop a metric the next state does publish. Taxonomy
      // order, for the same reason as National: nothing is "most recent" here.
      onSelectAll={() => setSelOrder(stateCatalogOrder())}
      onClearAll={() => setSelOrder([])}
      anchorId={anchorId} priceType={priceType} cpiData={cpiData}
    />
  );

  const annualTiles = (idx.annual || []).filter(a => sd.annual && sd.annual[a.id] != null);

  return (
    <React.Fragment>
      {stateBar}
      <div className="at-pad" style={{ padding: '36px 56px 56px' }}>
        {/* Both picker containers always render; CSS picks one at the current
            width. Same markup as NationalView, so the two tabs cross the
            1060px breakpoint identically. */}
        <div className="at-nat-layout">
          <div className="at-rail">{metricPicker('rail')}</div>

          <div style={{ minWidth: 0 }}>
            <div className="at-natmenu">{metricPicker('menu')}</div>

            <div className="at-section-head" style={styles.sectionHead}>
              <span style={styles.sectionTitle}>{sd.name}</span>
              <span className="at-section-dek" style={styles.sectionDek}>
                {isUS
                  ? 'The national versions of every state metric.'
                  : 'No state-level CPI exists — these are the price and income series that do.'}
              </span>
            </div>

            {selectedCards.length === 0 ? (
              <div style={{
                background: SURFACE, border: `1px solid rgba(44,50,84,.18)`,
                padding: '48px 32px', textAlign: 'center',
                fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE,
              }}>
                Pick a metric from the list to chart it.
              </div>
            ) : (
              /* 380px to match National. At 420 the two tabs sized their cards
                 differently for no reason a reader could see. */
              <div className="at-cards-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: 0,
                border: `1px solid rgba(44,50,84,.14)`, background: SURFACE }}>
                {selectedCards.map(({ item, factLabel, rankNote, rankText }, i) => {
                  const col = i % 2;
                  const row = Math.floor(i / 2);
                  const lastRow = Math.floor((selectedCards.length - 1) / 2);
                  return (
                    <div key={item.id} className="at-card" style={{
                      borderRight: col < 1 ? `1px solid rgba(44,50,84,.14)` : 'none',
                      borderBottom: row < lastRow ? `1px solid rgba(44,50,84,.14)` : 'none',
                    }}>
                      <ChartCard item={item} anchorId={anchorId} displayMode={displayMode}
                                 priceType={priceType} cpiData={cpiData}
                                 factLabel={factLabel}
                                 rankNote={rankNote} rankText={rankText} />
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>

        {annualTiles.length > 0 && (
          <React.Fragment>
            <div className="at-section-head" style={{ ...styles.sectionHead, marginTop: 48 }}>
              <span style={styles.sectionTitle}>The annual picture</span>
              <span className="at-section-dek" style={styles.sectionDek}>
                Costs and debt burdens published once a year — context, not live tracking.
              </span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 14 }}>
              {annualTiles.map(a => (
                <div key={a.id} style={{
                  background: SURFACE, border: `1px solid rgba(44,50,84,.16)`,
                  padding: '16px 18px',
                }}>
                  <div style={{
                    fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
                    fontSize: 10, letterSpacing: '.14em', textTransform: 'uppercase',
                    fontWeight: 700, color: MUTE, marginBottom: 8,
                  }}>{a.label}</div>
                  <div style={{ fontFamily: 'Publico Banner, Georgia, serif', fontSize: 30, fontWeight: 500 }}>
                    {fmtAnnual(sd.annual[a.id], a.units)}
                  </div>
                  <div style={{ fontSize: 11, color: MUTE, marginTop: 6, lineHeight: 1.45 }}>
                    {a.units} · {a.year}<br/>
                    <a href={a.source_url} target="_blank" rel="noopener noreferrer"
                       style={{ color: MUTE, textDecoration: 'underline', textUnderlineOffset: 2 }}>{a.source}</a>
                  </div>
                </div>
              ))}
            </div>
          </React.Fragment>
        )}
      </div>
    </React.Fragment>
  );
}

// ── Compare view: overlay chart(s), pinned states (US pinnable too) ─────────
function CompareChart({ metric, seriesList, anchorId, displayMode, height = 340 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [chartReady, setChartReady] = useState(!!window.Chart);

  useEffect(() => { loadChartJs().then(() => setChartReady(true)); }, []);

  const asPct = metric.rebase || displayMode === 'pct';
  // Same rule as the national cards: a rate series shows points, not percent.
  const rate = isRateSeries(metric);

  useEffect(() => {
    if (!chartReady || !canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    const ctx = canvasRef.current.getContext('2d');

    const datasets = seriesList.map(s => {
      // Resolved per state, like the cards: the Compare view's default metric is
      // the annual ACA premium, so an unresolved anchor split 2019 from 2020.
      const since = anchorObsDate(s.data, anchorId);
      let vis = sliceFrom(s.data, since);
      if (asPct && vis.length) {
        const v0 = vis[0].value;
        vis = vis.map(d => ({ date: d.date, value: changeIn(v0, d.value, rate) ?? 0 }));
      }
      return {
        label: s.label,
        data: vis.map(d => ({ x: d.date, y: d.value })),
        borderColor: s.color,
        borderWidth: s.dashed ? 1.6 : 2,
        borderDash: s.dashed ? [5, 4] : undefined,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.32,
        fill: false,
        // Clip at the plot area horizontally so lines never bleed into the
        // axis labels; the x-axis inset below keeps endpoints (and their
        // hover circles) clear of the edges.
        clip: { left: 0, right: 0, top: 12, bottom: 0 },
      };
    });

    // Same endpoint inset as the national cards: ~2.5% on each side.
    const ts = datasets.flatMap(ds => ds.data.map(p => +new Date(p.x))).filter(Number.isFinite);
    const tPad = ts.length > 1
      ? Math.max((Math.max(...ts) - Math.min(...ts)) * 0.025, 86400000)
      : 86400000;
    const xMin = ts.length ? Math.min(...ts) - tPad : undefined;
    const xMax = ts.length ? Math.max(...ts) + tPad : undefined;

    const displayUnits = asPct ? (rate ? 'pp change' : '%') : metric.units;

    chartRef.current = new window.Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8 } },
        animation: { duration: 350, easing: 'easeOutQuart' },
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: NAVY, titleColor: '#9BA8C2', bodyColor: PAPER,
            borderColor: 'rgba(244,242,228,.15)', borderWidth: 1, padding: 11,
            cornerRadius: 4, displayColors: true, boxWidth: 8, boxHeight: 8,
            titleFont: { size: 10, family: 'Public Sans, system-ui', weight: '600' },
            bodyFont:  { size: 12, family: 'Public Sans, system-ui', weight: '600' },
            callbacks: {
              title: (c) => fmtObsDate(c[0].parsed.x, seriesList[0]?.data, { year: 'numeric', month: 'long' }),
              label: (c) => ` ${c.dataset.label}: ${fmtVal(c.parsed.y, displayUnits)}`,
            },
          },
        },
        scales: {
          x: {
            type: 'time',
            min: xMin,
            max: xMax,
            time: { unit: anchorId === '1y' ? 'month' : 'year' },
            grid: { display: false }, border: { display: false },
            ticks: { color: MUTE, font: { size: 10, family: 'Public Sans, system-ui' }, maxTicksLimit: 7 },
          },
          y: {
            position: 'right',
            grid: { color: 'rgba(44,50,84,.08)', drawTicks: false },
            border: { display: false },
            ticks: {
              color: MUTE, font: { size: 10, family: 'Public Sans, system-ui' },
              callback: (v) => fmtVal(v, displayUnits),
            },
          },
        },
      },
    });

    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [chartReady, metric, seriesList, anchorId, displayMode]);

  return (
    <div style={{ height, position: 'relative' }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

// ── Level color scale, shared by the choropleth and the bar chart ───────────
// Sequential ramp for levels, pale blue → ESP navy #2c3254 at the top (August
// 2026: the warm sand → burnt sienna ramp read as a heat map, and red carries a
// bad-news signal this scale doesn't mean — dark = high, whatever high means).
// Pre-sampled from a Lab interpolation, bent through a more saturated mid
// (#6e7ca8) so the middle of the scale stays blue instead of going gray, and
// held in a plain array so the bar chart can render before the map libs load.
// Domain is quantile-clamped at the 5th/95th percentile (legend says ≤ / ≥) so
// one outlier state (usually DC) can't wash every other state into the light
// end.
const LEVEL_RAMP = ['#d3dcf0','#b9c3de','#a0abcc','#8793ba','#6e7ca8','#5d6892','#4c567d','#3c4368','#2c3254'];
// Warm neutral gray: it has to be unmistakably NOT a ramp step, and the ramp's
// light end is now a cool blue, so the separation is hue as well as value.
const MAP_NO_DATA = '#DBD8CE';

function rampColor(t) {
  const x = Math.max(0, Math.min(1, t)) * (LEVEL_RAMP.length - 1);
  const i = Math.min(Math.floor(x), LEVEL_RAMP.length - 2);
  const f = x - i;
  const ch = (h, k) => parseInt(h.slice(1 + k * 2, 3 + k * 2), 16);
  const mix = (k) => Math.round(ch(LEVEL_RAMP[i], k) + f * (ch(LEVEL_RAMP[i + 1], k) - ch(LEVEL_RAMP[i], k)));
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}

function quantileSorted(sorted, p) {
  if (!sorted.length) return null;
  const x = (sorted.length - 1) * p, i = Math.floor(x), f = x - i;
  return i + 1 < sorted.length ? sorted[i] + f * (sorted[i + 1] - sorted[i]) : sorted[i];
}

function makeLevelScale(values) {
  const vals = values.filter(v => v != null && isFinite(v)).sort((a, b) => a - b);
  let lo = quantileSorted(vals, 0.05), hi = quantileSorted(vals, 0.95);
  if (!(hi > lo)) { lo = vals.length ? vals[0] : 0; hi = vals.length ? vals[vals.length - 1] : 1; }
  const color = (v) => {
    if (v == null || !isFinite(v)) return MAP_NO_DATA;
    return rampColor(hi > lo ? (v - lo) / (hi - lo) : 0.5);
  };
  const grad = `linear-gradient(90deg, ${[0, 0.25, 0.5, 0.75, 1].map(rampColor).join(', ')})`;
  return { color, lo, hi, grad };
}

// ── Choropleth map: one metric, all states, levels only ─────────────────────
// D3-geo + topojson-client + the us-atlas states topology (lazy-loaded from
// jsDelivr the first time the map is opened). Paints the level for the
// selected year; change over time lives on the pinned-states chart below.
// `onPick` is optional — when provided, clicking a state pins it.
function USMap({ metric, rows, pinned = [], onPick, periodLabel }) {
  const [feats, setFeats] = useState(null);
  const [err, setErr] = useState(false);
  const [tip, setTip] = useState(null);
  const boxRef = useRef(null);

  useEffect(() => {
    let live = true;
    loadMapLibs()
      .then(f => { if (live) setFeats(f); })
      .catch(() => { if (live) setErr(true); });
    return () => { live = false; };
  }, []);

  const byCode = useMemo(() => {
    const m = {};
    rows.forEach(r => { m[r.code] = r; });
    return m;
  }, [rows]);

  // Project once per topology load, not per render: geoAlbersUsa at the
  // standard 975×610 layout (composite projection — Alaska/Hawaii insets;
  // territories return no path and are dropped along with non-state ids).
  const shapes = useMemo(() => {
    if (!feats || !window.d3) return null;
    const path = window.d3.geoPath(window.d3.geoAlbersUsa().scale(1300).translate([487.5, 305]));
    return feats
      .map(f => ({ id: f.id, code: FIPS_TO_POSTAL[f.id], d: path(f) }))
      .filter(s => s.code && s.d);
  }, [feats]);

  if (err) {
    return (
      <div style={{
        background: SURFACE, border: '1px solid rgba(44,50,84,.18)', padding: '48px 32px',
        textAlign: 'center', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE,
      }}>Could not load the map assets (offline?). The Compare States view has the same data.</div>
    );
  }
  if (!feats) {
    return (
      <div style={{ padding: '48px 0', textAlign: 'center', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
        Loading map…
      </div>
    );
  }

  const scale = makeLevelScale(rows.map(r => r.value));

  const move = (e, code) => {
    const rect = boxRef.current ? boxRef.current.getBoundingClientRect() : { left: 0, top: 0, width: 0 };
    setTip({ code, x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width });
  };

  const tipRow = tip ? byCode[tip.code] : null;

  // Legend: the shared scale's gradient, with ≤ / ≥ end labels because the
  // domain is quantile-clamped.
  const legendLo = '≤ ' + fmtVal(scale.lo, metric.units);
  const legendHi = '≥ ' + fmtVal(scale.hi, metric.units);

  return (
    <div ref={boxRef} style={{ position: 'relative', background: SURFACE, border: '1px solid rgba(44,50,84,.18)', padding: '20px 20px 12px' }}>
      <svg viewBox="0 0 975 610" style={{ width: '100%', display: 'block' }}>
        {(shapes || []).map(s => {
          const r = byCode[s.code];
          return (
            <path
              key={s.id}
              d={s.d}
              fill={scale.color(r ? r.value : null)}
              stroke={SURFACE}
              strokeWidth="1"
              style={{ cursor: r && onPick ? 'pointer' : 'default' }}
              onClick={() => { if (r && onPick) onPick(s.code); }}
              onMouseMove={(e) => move(e, s.code)}
              onMouseLeave={() => setTip(null)}
            />
          );
        })}
        {/* pinned outlines drawn on top */}
        {(shapes || []).map(s => {
          const pi = pinned.indexOf(s.code);
          if (pi < 0) return null;
          return (
            <path key={'pin' + s.id} d={s.d} fill="none" pointerEvents="none"
                  stroke={PIN_COLORS[pi % PIN_COLORS.length]} strokeWidth="2.5" />
          );
        })}
      </svg>

      {tip && (
        <div style={{
          position: 'absolute',
          left: Math.min(tip.x + 14, (tip.w || 300) - 190), top: tip.y + 14,
          // Light coral, now that the states themselves are navy — the hover
          // card has to read as an overlay, not as the darkest step of the
          // ramp. Text is navy, not cream: this fill is too light for cream
          // to clear AA (see the MAP_TIP comment above).
          background: MAP_TIP, color: NAVY, padding: '9px 12px', borderRadius: 4,
          pointerEvents: 'none', zIndex: 5, width: 180,
          fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', fontSize: 12,
          boxShadow: '0 6px 18px rgba(0,0,0,.25)',
        }}>
          <div style={{ fontWeight: 800, marginBottom: 3 }}>{tipRow ? tipRow.name : tip.code}</div>
          {tipRow && tipRow.value != null ? (
            <React.Fragment>
              <div>{fmtVal(tipRow.value, metric.units)}
                {tipRow.obsLabel && <span style={{ color: MAP_TIP_WARM }}> · {tipRow.obsLabel}</span>}
              </div>
              {tipRow.rank != null && (
                <div style={{ color: MAP_TIP_DIM, marginTop: 2 }}>{ordinal(tipRow.rank)} highest of {tipRow.rankN}</div>
              )}
              {onPick && (
                <div style={{ color: MAP_TIP_DIM, marginTop: 3, fontSize: 10 }}>Click to pin on the chart</div>
              )}
            </React.Fragment>
          ) : (
            <div style={{ color: MAP_TIP_DIM }}>No data for this period</div>
          )}
        </div>
      )}

      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginTop: 8,
        fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', fontSize: 10, color: MUTE,
      }}>
        <span style={{ fontStyle: 'italic', fontFamily: 'Publico, Georgia, serif', fontSize: 12 }}>
          {periodLabel} · gray = no data
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span>{legendLo}</span>
          <span style={{ width: 120, height: 10, background: scale.grad, display: 'inline-block' }} />
          <span>{legendHi}</span>
        </span>
      </div>
    </div>
  );
}

// ── Bar-chart alternative to the choropleth: every state, sorted ────────────
// Same rows and color scale as the map; bars are sorted highest-first so the
// full ranking is readable at a glance. Clicking a row pins the state on the
// chart below, exactly like clicking it on the map.
function StateBarList({ metric, rows, pinned = [], onPick, periodLabel }) {
  const scale = makeLevelScale(rows.map(r => r.value));
  const has = rows.filter(r => r.value != null && isFinite(r.value)).sort((a, b) => b.value - a.value);
  const missing = rows.length - has.length;
  const max = has.length ? has[0].value : 1;

  return (
    <div style={{ background: SURFACE, border: '1px solid rgba(44,50,84,.18)', padding: '20px 20px 12px' }}>
      <div style={{ fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif' }}>
        {has.map(r => {
          const pi = pinned.indexOf(r.code);
          const pinColor = pi >= 0 ? PIN_COLORS[pi % PIN_COLORS.length] : null;
          return (
            <div key={r.code} onClick={() => { if (onPick) onPick(r.code); }}
              title={onPick ? 'Click to pin on the chart' : undefined}
              style={{
                display: 'grid', gridTemplateColumns: '30px minmax(110px, 170px) 1fr 90px',
                alignItems: 'center', gap: 10, padding: '3px 6px',
                cursor: onPick ? 'pointer' : 'default',
                background: pinColor ? hexToRgba(pinColor, 0.10) : 'transparent',
              }}>
              <span style={{ fontSize: 10, fontWeight: 600, color: SOFT, textAlign: 'right' }}>{r.rank != null ? r.rank : ''}</span>
              <span style={{
                fontSize: 12.5, fontWeight: pinColor ? 800 : 600, color: INK,
                display: 'inline-flex', alignItems: 'center', gap: 7,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>
                {pinColor && <span style={{ width: 9, height: 9, borderRadius: 5, background: pinColor, flexShrink: 0 }} />}
                {r.name}
              </span>
              <span style={{ background: 'rgba(44,50,84,.06)', height: 14, position: 'relative' }}>
                <span style={{
                  position: 'absolute', left: 0, top: 0, bottom: 0,
                  width: `${Math.max(max > 0 ? (r.value / max) * 100 : 0, 0.75)}%`,
                  background: scale.color(r.value),
                }} />
              </span>
              <span style={{ fontSize: 12, fontWeight: 700, color: INK, textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>
                {fmtVal(r.value, metric.units)}
              </span>
            </div>
          );
        })}
      </div>

      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginTop: 10,
        fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', fontSize: 10, color: MUTE,
      }}>
        <span style={{ fontStyle: 'italic', fontFamily: 'Publico, Georgia, serif', fontSize: 12 }}>
          {periodLabel}{missing > 0 ? ` · ${missing} ${missing === 1 ? 'state has' : 'states have'} no data for this period` : ''}
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span>{'≤ ' + fmtVal(scale.lo, metric.units)}</span>
          <span style={{ width: 120, height: 10, background: scale.grad, display: 'inline-block' }} />
          <span>{'≥ ' + fmtVal(scale.hi, metric.units)}</span>
        </span>
      </div>
    </div>
  );
}

// ── Map-view export helpers ─────────────────────────────────────────────────
// The branded PNG exporter (downloadCardAsPNG) takes a canvas for its chart
// slot. The choropleth is an SVG and the bar list is plain DOM, so each gets
// rasterized onto an offscreen canvas first — drawn directly, no DOM-cloning
// library (same reasoning as downloadCardAsPNG itself).

// Choropleth → canvas: serialize the live SVG (fills are plain attributes,
// no external fonts), draw it contained in the exporter's 1280×540 slot,
// and add the level legend top-right.
async function mapToExportCanvas(svgEl, scale, metric) {
  const S = 2, W = 1280, H = 540;
  const canvas = document.createElement('canvas');
  canvas.width = W * S; canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);

  const clone = svgEl.cloneNode(true);
  clone.setAttribute('width', 975);
  clone.setAttribute('height', 610);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  const img = new Image();
  await new Promise((res) => { img.onload = res; img.onerror = res; img.src = url; });
  const mh = H, mw = 975 * (mh / 610);
  ctx.drawImage(img, (W - mw) / 2, 0, mw, mh);

  const lw = 160, lh = 12, lx = W - lw - 10, ly = 16;
  const grad = ctx.createLinearGradient(lx, 0, lx + lw, 0);
  [0, 0.25, 0.5, 0.75, 1].forEach(t => grad.addColorStop(t, rampColor(t)));
  ctx.fillStyle = grad; ctx.fillRect(lx, ly, lw, lh);
  ctx.fillStyle = INK;
  ctx.font = '600 13px "Public Sans", system-ui, sans-serif';
  ctx.textAlign = 'right'; ctx.fillText('≤ ' + fmtVal(scale.lo, metric.units), lx - 8, ly + 11);
  ctx.textAlign = 'left';  ctx.fillText('≥ ' + fmtVal(scale.hi, metric.units), lx + lw + 8, ly + 11);
  return canvas;
}

// Bar list → canvas: redraw the sorted rows (rank, name, bar, value) at a
// readable row height; the exporter grows the card to fit via chartH.
function barsToExportCanvas(rows, scale, metric) {
  const S = 2, W = 1280, ROW = 24, PAD = 8;
  const has = rows.filter(r => r.value != null && isFinite(r.value)).sort((a, b) => b.value - a.value);
  const H = Math.max(has.length * ROW + PAD * 2, 100);
  const canvas = document.createElement('canvas');
  canvas.width = W * S; canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);

  const max = has.length ? has[0].value : 1;
  const rankX = 34, nameX = 44, barX = 290, barW = 850, valX = W - 10;
  const DISPLAY = '"Public Sans", system-ui, sans-serif';
  has.forEach((r, i) => {
    const y = PAD + i * ROW;
    ctx.fillStyle = 'rgba(44,50,84,.06)';
    ctx.fillRect(barX, y + 5, barW, ROW - 10);
    ctx.fillStyle = scale.color(r.value);
    ctx.fillRect(barX, y + 5, Math.max(max > 0 ? (r.value / max) * barW : 0, 2), ROW - 10);
    ctx.fillStyle = SOFT;
    ctx.font = `600 11px ${DISPLAY}`;
    ctx.textAlign = 'right'; ctx.fillText(r.rank != null ? String(r.rank) : '', rankX, y + 17);
    ctx.fillStyle = INK;
    ctx.font = `600 13px ${DISPLAY}`;
    ctx.textAlign = 'left'; ctx.fillText(r.name, nameX, y + 17);
    ctx.font = `700 13px ${DISPLAY}`;
    ctx.textAlign = 'right'; ctx.fillText(fmtVal(r.value, metric.units), valX, y + 17);
  });
  return { canvas, chartH: H };
}

// CSV of exactly what the map/bar chart shows: one row per state, the
// selected year's value (each state's last reading in that year), sorted by
// rank. When the Real toggle is on the values are the deflated ones on
// screen — the header comment says so.
function downloadStateYearCSV(metric, rows, year, isReal) {
  const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const sorted = rows.slice().sort((a, b) =>
    (b.value ?? -Infinity) - (a.value ?? -Infinity) || a.name.localeCompare(b.name));
  const header = 'state,code,value,units,observation_date,rank\n';
  const body = sorted.map(r =>
    [esc(r.name), r.code, r.value ?? '', esc(metric.units || ''), r.obsDate || '', r.rank ?? ''].join(',')).join('\n');
  // Provenance appended at the bottom (see downloadCSV) so the header is line 1.
  const sourceLine = `# ${metric.label} — all states, ${year}\n`
    + `# ${metric.source_label || 'public data'}${metric.source_url ? `\n# Source: ${metric.source_url}` : ''}\n`
    + (isReal ? '# Values are inflation-adjusted to latest-month dollars using the national CPI-U\n' : '');
  const blob = new Blob([`${header}${body}\n\n${sourceLine}`], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${metric.id}-states-${year}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Footer bar with the CSV/PNG export buttons — same shape as the compare
// panels' footer (source left, buttons right).
function ExportFooter({ metric, onCSV, onPNG }) {
  const hover = {
    onMouseEnter: (e) => { e.currentTarget.style.background = NAVY; e.currentTarget.style.color = PAPER; },
    onMouseLeave: (e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = NAVY; },
  };
  return (
    <div style={{
      fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
      fontSize: 9, color: SOFT, letterSpacing: '.1em',
      textTransform: 'uppercase',
      marginTop: 12, paddingTop: 8, borderTop: `1px solid rgba(44,50,84,.1)`,
      display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12,
    }}>
      {metric.source_url ? (
        <a href={metric.source_url} target="_blank" rel="noopener noreferrer"
           onClick={handleSourceLinkClick}
           style={{ color: SOFT, textDecoration: 'none', borderBottom: '1px dotted rgba(44,50,84,.3)' }}
           onMouseEnter={(e) => { e.currentTarget.style.color = NAVY; }}
           onMouseLeave={(e) => { e.currentTarget.style.color = SOFT; }}>
          Source · {metric.source_label} ↗
        </a>
      ) : (
        <span>Source · {metric.source_label || 'Derived from public data'}</span>
