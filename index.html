<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Economic Security Project's Affordability Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- ESP Publico Banner (Medium), embedded as a data URI so it loads inside the
     sandboxed embed iframe (null origin). Injects an @font-face; see below. -->
<script src="assets/fonts_publico.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Public Sans', system-ui, sans-serif;
    background: #0E1320;
    color: #0E1320;
  }
  /* ESP licensed Publico Banner (Medium) is embedded as a data URI by
     assets/fonts_publico.js (loaded below) — a self-hosted .otf would be
     CORS-blocked inside the sandboxed embed iframe. Reserved for large
     emphasis numbers only. */
  /* Type decision (July 2026): Public Sans everywhere — labels, headings, chart
     text, body — with Publico Banner reserved only for large emphasis numbers.
     The two hooks below fold the former serif (Publico) and display (Neue Haas)
     layers down to Public Sans; the third, equal-specificity but later rule
     re-promotes just the elements explicitly tagged "Publico Banner" inline.
     (Attribute selectors have equal specificity, so source order decides:
     "Publico Banner" also matches [style*="Publico"], and the later rule wins.) */
  [style*="Publico"] { font-family: 'Public Sans', system-ui, sans-serif !important; }
  [style*="Neue Haas Grotesk"] { font-family: 'Public Sans', system-ui, sans-serif !important; }
  [style*="Publico Banner"] { font-family: 'Publico Banner', Georgia, serif !important; }
  #root { display: flex; justify-content: center; min-height: 100vh; background: #0E1320; }
  /* ESP cream everywhere except the data panels, which are white (August 2026,
     to sit inside the Resources template on economicsecurityproject.org). The
     page used to be beige #f4f2e4 with cream panels; that reads as one flat
     surface next to the ESP page. Now the surround is #FFFDF2 and only chart
     and table panels are white, so the data reads as sitting ON the page. */
  #stage { background: #FFFDF2; box-shadow: 0 30px 80px rgba(0,0,0,.5); width: 100%; flex-shrink: 0; }

  /* Hairline under the menu bars, inset to the content column (August 2026).
     These bars are full-bleed, so a plain border-bottom ran the rule from
     window edge to window edge while everything it separates — the rail on the
     left, the cards on the right — starts 56px in. The rule now spans exactly
     rail + cards by riding the same padding .at-pad uses, and tracks the
     window because those paddings are the responsive ones below. */
  .at-inset-rule { position: relative; }
  .at-inset-rule::after {
    content: ''; position: absolute; left: 56px; right: 56px; bottom: 0;
    height: 1px; background: rgba(44,50,84,.18); pointer-events: none;
  }

  /* Card grid items must allow shrinking below their min-content so the
     auto-fit minmax() track can actually compress the chart canvas with
     the viewport. Without this, grid items default to min-width: auto
     (≈ min-content) and the chart stops shrinking. */
  .at-card { min-width: 0; }

  /* Responsive overrides — !important is needed because the React tree uses inline styles. */
  @media (max-width: 960px) {
    .at-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .at-inset-rule::after { left: 24px; right: 24px; }
    .at-card { border-right: none !important; }
    .at-range-row { flex-wrap: wrap !important; }
    .at-heatmap-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .at-heatmap-scroll > div { min-width: 860px; }
    .at-controls { flex-wrap: wrap !important; }
  }
  @media (max-width: 640px) {
    .at-pad { padding-left: 16px !important; padding-right: 16px !important; }
    .at-inset-rule::after { left: 16px; right: 16px; }
    .at-hero { padding-top: 40px !important; padding-bottom: 36px !important; }
    .at-section-head { flex-wrap: wrap !important; }
    .at-section-dek { margin-left: 0 !important; flex-basis: 100% !important; }
  }

  /* ── National metric picker: one row component, two containers ─────────────
     "The merge" from picker_mockups.html (options 6 + 2 + 11). Above the
     breakpoint the rows are a left rail; below it the same rows collapse into
     a menu. One row component, two containers, one selection.

     The rail deliberately has no inner scroll, no border and no background of
     its own. Those three things — not the concept — were what made the earlier
     left-rail proposal read as bolted on. It runs long in normal document flow
     and the page scrolls as one document, which is how the shop filters this is
     modelled on actually behave.

     There is no sticky "jump back to the picker" bar, on purpose. The ESP page
     resizes the iframe to the tracker's full content height, so the iframe
     never scrolls — the parent page does. Inside it, position:fixed pins to the
     bottom of the whole document rather than the reader's screen, and sticky
     has nothing to stick against. Such a bar would work only on the standalone
     page, i.e. only for the version of this the public does not see.

     1060px is the breakpoint: a 220px rail still leaves room for two 380px
     chart columns once the page is ~1092px (page − 112px of .at-pad padding
     − 220px of rail ≥ 760px). Between 1060 and 1092 the charts briefly fall to
     one column; below 1060 the rail hands over to the menu entirely. */
  .at-nat-layout { display: block; }
  .at-rail { display: none; }
  .at-natmenu { display: block; }
  @media (min-width: 1060px) {
    .at-nat-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
    .at-rail { display: block; padding: 2px 18px 30px 0; }
    .at-natmenu { display: none; }
  }

  /* The shared row: name, change from the active anchor, and a mark to add. */
  .at-prow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 9px;
             align-items: center; width: 100%; background: none; border: 0;
             padding: 5px 6px; border-radius: 2px; cursor: pointer; text-align: left;
             font-family: "Neue Haas Grotesk Display Pro", sans-serif; font-size: 13px;
             color: #2c3254; }
  .at-prow:hover { background: rgba(44,50,84,.07); }
  .at-prow.on { background: rgba(112,173,143,.17); color: #232849; font-weight: 600; }
  .at-prow:focus-visible { outline: 2px solid #2c3254; outline-offset: 1px; }
  /* Long labels — "Rent in Hours of Work", "Credit Card Delinquency" — wrap
     rather than push the change number out of a 220px rail. */
  .at-prow-name { line-height: 1.3; overflow-wrap: break-word; min-width: 0; }
  .at-prow-mark { color: #caccd4; font-size: 12px; text-align: center;
                  align-self: start; margin-top: 2px; }
  .at-prow.on .at-prow-mark { color: #3E6E57; font-weight: 800; }
  .at-prow-ch { font-size: 11.5px; font-weight: 600; color: #6B6E78;
                font-variant-numeric: tabular-nums; }
  .at-prow.on .at-prow-ch { color: #8A4640; }

  /* Group headers are bulk toggles — the comms request this picker inherited
     ("let me throw groceries in with Big Ticket"). The hit area is the text
     itself rather than the full row, so a near-miss lands on nothing instead
     of silently adding eight metrics. */
  .at-grp { display: inline-block; margin: 20px 0 5px 1px; padding: 2px 5px;
            background: none; border: 0; border-radius: 2px; cursor: pointer;
            font-family: "Neue Haas Grotesk Display Pro", sans-serif;
            font-size: 9.5px; font-weight: 700; letter-spacing: .14em;
            text-transform: uppercase; color: #6B6E78; }
  .at-grp:first-child { margin-top: 0; }
  .at-grp:hover { background: rgba(44,50,84,.09); color: #2c3254; }
  .at-grp.on { color: #2c3254; }
  .at-grp:focus-visible { outline: 2px solid #2c3254; outline-offset: 1px; }
  /* Map's headings: same type, no affordance. A hover highlight on a heading
     that can't bulk-toggle (single-select tab) would promise a click that does
     nothing, which is worse than a plain label. */
  .at-grp.as-label { cursor: default; }
  .at-grp.as-label:hover { background: none; color: #6B6E78; }

  .at-pfilter { width: 100%; padding: 6px 9px; border: 1px solid #2c3254;
                border-radius: 3px; background: #fff; color: #232849;
                font-family: "Neue Haas Grotesk Display Pro", sans-serif;
                font-size: 12.5px; font-weight: 500; }
  .at-pfilter::placeholder { color: #6B6E78; font-weight: 400; }
  .at-phead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
              margin: 9px 0 13px; }
  .at-pcount { font-family: "Neue Haas Grotesk Display Pro", sans-serif;
               font-size: 11.5px; color: #6B6E78; }
  .at-plnk { background: none; border: 0; padding: 0; cursor: pointer; color: #2c3254;
             font-family: "Neue Haas Grotesk Display Pro", sans-serif; font-size: 10px;
             font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
             text-decoration: underline; text-underline-offset: 3px; }
  .at-plnk:hover { color: #0E1320; }
  .at-pstub { font-family: Publico, Georgia, serif; font-style: italic;
              font-size: 12.5px; color: #6B6E78; padding: 8px 6px; }

  /* The menu container, below the breakpoint. In normal document flow, so it
     pushes the charts down rather than overlaying them — an overlay would need
     the same viewport the iframe doesn't have. */
  .at-menubar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
                padding: 2px 0 12px; }
  .at-menupop { margin-top: 11px; max-width: 420px; padding: 14px; background: #fff;
                border: 1px solid #2c3254; border-radius: 3px; }

  /* Embed mode (?embed=1): the dashboard sits in an iframe on the ESP site,
     which supplies its own header. No dark surround/shadow, and the same
     cream-surround / white-panel rule as standalone — the iframe background
     has to MATCH the ESP page it sits on, and that page is #FFFDF2, not white.
     height:100% / min-height must come off in embed mode: the ESP height
     script measures document.body, and a body pinned to the iframe height
     could only ever grow, never shrink back on view switches. */
  html.embed, html.embed body { height: auto; }
  html.embed body { background: #FFFDF2; }
  html.embed #root { background: #FFFDF2; min-height: 0; }
  html.embed #stage { background: #FFFDF2; box-shadow: none; }

  /* In-app About view. The content comes from assets/about_content.js and is
     injected verbatim, so these rules mirror about.html's styles for the
     classes the content uses (h2, .lead, .note, tables, .freq badges),
     scoped under .at-about and mapped to this page's fonts. Keep the two in
     sync — same content, two hosts. */
  .at-about { --rule: rgba(44,50,84,.18); font-size: 14px; }
  /* No "§01" section tags (What to Check #3) — headings are plain text. */
  .at-about h2 {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 27px; font-weight: 600; margin: 44px 0 6px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(44,50,84,.25);
  }
  .at-about h2:first-of-type { margin-top: 0; }
  /* Paragraphs run the full column width, matching the tables below them: a
     narrower measure read as text cut off mid-sentence next to a full-bleed
     table, so the two are deliberately the same width. */
  .at-about p.lead { margin: 14px 0 18px; font-size: 15.5px; line-height: 1.65; max-width: none; }
  .at-about p.note { margin: 12px 0 18px; font-size: 13.5px; line-height: 1.65; color: #6B6E78; max-width: none; }
  .at-about p.note b { color: #0E1320; font-weight: 600; }
  .at-about .table-wrap { overflow-x: auto; margin: 18px 0 8px; }
  .at-about table {
    width: 100%; border-collapse: collapse; background: #FFFFFF;
    border: 1px solid var(--rule); font-size: 13.5px;
  }
  .at-about th {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 700; color: #6B6E78; text-align: left;
    padding: 10px 14px; border-bottom: 1px solid var(--rule);
    background: rgba(44,50,84,.045);
  }
  .at-about td { padding: 11px 14px; border-bottom: 1px solid rgba(44,50,84,.09); vertical-align: top; line-height: 1.5; }
  .at-about tr:last-child td { border-bottom: none; }
  .at-about td b { font-weight: 600; }
  .at-about td a { color: #2c3254; }
  /* Cadence badges: lightly-rounded rectangles like every other control here
     (What to Check #7), in muted ESP families rather than the former bright
     green/amber/red (What to Check #5). */
  .at-about .freq {
    font-family: 'Public Sans', system-ui, sans-serif;
    display: inline-block; font-size: 10.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 3px; white-space: nowrap;
    border: 1px solid;
  }
  .at-about .freq.m, .at-about .freq.w { background: #EAF1EC; color: #3E6E57; border-color: rgba(112,173,143,.55); }
  .at-about .freq.q { background: #F8F0DE; color: #8A6412; border-color: rgba(235,195,130,.7); }
  .at-about .freq.a { background: #F4E6E4; color: #8A4640; border-color: rgba(176,100,95,.45); }
</style>

<script>
  // Set before first paint so embed pages never flash the dark standalone chrome.
  if (new URLSearchParams(window.location.search).has('embed')) {
    document.documentElement.classList.add('embed');
  }
</script>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/app_data.js"></script>
<script src="data/states_index.js"></script>
<script src="assets/esp_logo.js"></script>

<script type="text/babel" data-presets="react">
(function() {
// ── Shared utilities ─────────────────────────────────────────────────────────
const ESP = {
  warmNavy:  '#2c3254',
  warmRed:   '#E04E39',
  beige:     '#f4f2e4',
  ink:       '#0E1320',
  paper:     '#FFFDF2',
  mute:      '#6B6E78',
  softMute:  '#9A9CA3',
  green:     '#2E7D5B',
};

// Format helpers. Percents get one decimal place (comms request: easier to
// read on charts); dollars keep cents only when small.
function fmtVal(val, units = '') {
  // "pp change since …" — what the %-change view calls its axis on a rate
  // series. Must precede the '%' branch, which would otherwise stamp a percent
  // sign on a percentage-point figure.
  if (units.startsWith('pp change')) return val.toFixed(1) + ' pp';
  if (units.includes('%')) return val.toFixed(1) + '%';
  if (units.includes('Billions')) return '$' + val.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'B';
  // "Hours of Work" (the derived rent_hours metric) — check before the $
  // branch so it doesn't collide with "$ per Hour".
  if (units.toLowerCase().startsWith('hours')) return val.toFixed(1) + ' hrs';
  if (units.includes('$') || units.toLowerCase().includes('gallon')) {
    return Math.abs(val) >= 1000
      ? '$' + val.toLocaleString(undefined, { maximumFractionDigits: 0 })
      : '$' + val.toFixed(2);
  }
  if (units.includes('Thousands')) return Math.round(val).toLocaleString();
  return val.toFixed(1);
}

// 1 → "1st", 2 → "2nd", 47 → "47th"
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// The three message anchors plus a short and a long window. "Pre-pandemic"
// is December 2019, not early 2020 — anchoring at 2020 bakes the COVID
// crash into the baseline (gas cratered in April 2020) and produces
// comparisons that don't survive scrutiny.
const ANCHORS = [
  { id: '1y',   label: '1 Year',         phrase: 'over the past year' },
  { id: '2025', label: 'Since Jan 2025', phrase: 'since Jan 2025' },
  { id: '2019', label: 'Pre-COVID',      phrase: 'since Dec 2019', title: 'December 2019' },
  { id: '2000', label: 'Since 2000',     phrase: 'since 2000' },
  { id: 'max',  label: 'Max',            phrase: 'all-time' },
];
// A custom start year picked from the dropdown is a synthetic anchor id of the
// form "y:YYYY" (e.g. "y:2015"). It flows through the same one-start-date
// pipeline as the presets: anchorById gives it a label/phrase, anchorDate
// resolves it to Jan 1 of that year.
function isYearAnchor(id) { return typeof id === 'string' && id.slice(0, 2) === 'y:'; }
function anchorById(id) {
  if (isYearAnchor(id)) { const y = id.slice(2); return { id, label: y, phrase: 'since ' + y }; }
  return ANCHORS.find(a => a.id === id) || ANCHORS[1];
}
function anchorDate(id, data) {
  if (id === '1y')  { const d = new Date(); d.setFullYear(d.getFullYear() - 1); return d.toISOString().slice(0, 10); }
  if (id === '2025') return '2025-01-01';
  if (id === '2019') return '2019-12-01';
  if (id === '2000') return '2000-01-01';
  if (isYearAnchor(id)) return id.slice(2) + '-01-01';
  return (data && data.length) ? data[0].date : '1900-01-01';
}

// Render the card to a branded PNG by drawing directly to a canvas.
// We avoid html-to-image / DOM-cloning approaches because they were
// producing blank captures (font fallbacks not surviving the clone,
// data-URL <img> elements not decoding before snapshot, foreignObject
// CORS quirks). Drawing the chart canvas + text on a fresh canvas is
// deterministic and needs no external library.

// The ESP wordmark logo, loaded once from the embedded data URI (assets/esp_logo.js).
// A data-URI source never taints the canvas, so PNG export keeps working under
// file://, http, and offline. Resolves to null if the asset is unavailable.
let _espLogoPromise = null;
function loadEspLogo() {
  if (_espLogoPromise) return _espLogoPromise;
  _espLogoPromise = new Promise((resolve) => {
    const src = (typeof window !== 'undefined' && window.ESP_LOGO_DATAURI) || null;
    if (!src) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
  return _espLogoPromise;
}

async function downloadCardAsPNG({
  chartCanvas, item, accent, headlineText, changeText, changeColor, rangeLabel, legend,
  chartH = 540, // taller charts (the Map view's all-states bar list) grow the card
}) {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }

  // 2x for retina-grade output; final PNG is 1440 × 1080 at the default chartH.
  const SCALE = 2;
  const W = 1440, H = 1080 + (chartH - 540);
  const canvas = document.createElement('canvas');
  canvas.width  = W * SCALE;
  canvas.height = H * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.textBaseline = 'alphabetic';

  const PAPER = '#FFFDF2';
  const INK   = '#0E1320';
  const NAVY  = '#2c3254';
  const MUTE  = '#6B6E78';
  const SERIF   = '"Publico Banner", Georgia, serif';
  const DISPLAY = '"Public Sans", system-ui, sans-serif';

  // Background
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // ── Header band ─────────────────────────────────────────────────────────
  const padX = 80;

  // ESP logo (the wordmark "Economic Security Project" is part of the artwork,
  // so no separate text wordmark — that would duplicate the title).
  const espLogo = await loadEspLogo();
  if (espLogo && espLogo.naturalWidth) {
    const logoH = 84;
    const logoW = logoH * (espLogo.naturalWidth / espLogo.naturalHeight);
    ctx.drawImage(espLogo, padX, 72, logoW, logoH);
  } else {
    // Fallback if the embedded logo failed to load: draw the old "E" mark + wordmark.
    ctx.fillStyle = NAVY;
    ctx.fillRect(padX, 80, 56, 56);
    ctx.fillStyle = PAPER;
    ctx.font = `600 36px ${SERIF}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('E', padX + 28, 80 + 30);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = NAVY;
    ctx.font = `700 28px ${DISPLAY}`;
    ctx.fillText('Economic Security Project', padX + 76, 110);
  }

  // Tagline + date (right side)
  ctx.textAlign = 'right';
  ctx.fillStyle = NAVY;
  ctx.font = `700 16px ${DISPLAY}`;
  ctx.fillText('THE AFFORDABILITY TRACKER', W - padX, 110);
  ctx.fillStyle = MUTE;
  ctx.font = `600 14px ${DISPLAY}`;
  const today = new Date().toLocaleDateString('en-US', {
    month: 'long', day: 'numeric', year: 'numeric',
  }).toUpperCase();
  ctx.fillText(today, W - padX, 134);

  // Header divider
  ctx.strokeStyle = 'rgba(44,50,84,.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, 180);
  ctx.lineTo(W - padX, 180);
  ctx.stroke();

  // ── Card area ───────────────────────────────────────────────────────────
  const cardTop = 220;

  // Top accent bar (brand color of this series)
  ctx.fillStyle = accent;
  ctx.fillRect(padX, cardTop, W - padX * 2, 4);

  // Eyebrow — item.eyebrow (state name) wins over the category label
  const eyebrow = (item.eyebrow || categoryLabel(item.category)).toUpperCase();
  ctx.textAlign = 'left';
  ctx.fillStyle = accent;
  ctx.font = `700 18px ${DISPLAY}`;
  ctx.fillText(eyebrow, padX, cardTop + 50);

  // Title (auto-shrink if it would collide with the right-side headline)
  const headlineRightWidth = (() => {
    ctx.font = `500 76px ${SERIF}`;
    return ctx.measureText(headlineText).width;
  })();
  const titleMaxWidth = (W - padX * 2) - headlineRightWidth - 60;
  let titleSize = 56;
  ctx.fillStyle = INK;
  for (; titleSize >= 32; titleSize -= 2) {
    ctx.font = `600 ${titleSize}px ${DISPLAY}`;
    if (ctx.measureText(item.label).width <= titleMaxWidth) break;
  }
  ctx.fillText(item.label, padX, cardTop + 110);

  // Subtitle — or, for multi-line compare exports, a color-dot legend
  // (the chart canvas itself has no legend; the on-page chips play that role)
  if (legend && legend.length) {
    ctx.textAlign = 'left';
    ctx.font = `600 20px ${DISPLAY}`;
    let lx = padX;
    const ly = cardTop + 148;
    for (let i = 0; i < legend.length; i++) {
      const entryW = 20 + ctx.measureText(legend[i].label).width + 28;
      if (i > 0 && lx + entryW > W - padX) {
        ctx.fillStyle = MUTE;
        ctx.fillText(`+ ${legend.length - i} more`, lx, ly);
        break;
      }
      ctx.fillStyle = legend[i].color;
      ctx.beginPath();
      ctx.arc(lx + 7, ly - 7, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = INK;
      ctx.fillText(legend[i].label, lx + 20, ly);
      lx += entryW;
    }
  } else if (item.subtitle) {
    ctx.fillStyle = MUTE;
    ctx.font = `italic 22px ${DISPLAY}`;
    ctx.fillText(item.subtitle, padX, cardTop + 145);
  }

  // Headline value (right side)
  ctx.textAlign = 'right';
  ctx.fillStyle = INK;
  ctx.font = `500 76px ${SERIF}`;
  ctx.fillText(headlineText, W - padX, cardTop + 110);

  // Change line under headline
  ctx.fillStyle = changeColor || accent;
  ctx.font = `700 22px ${DISPLAY}`;
  ctx.fillText(changeText, W - padX, cardTop + 145);

  // ── Chart ───────────────────────────────────────────────────────────────
  if (chartCanvas) {
    let chartUrl = null;
    try { chartUrl = chartCanvas.toDataURL('image/png'); } catch (e) {}
    if (chartUrl) {
      const img = new Image();
      await new Promise((resolve) => {
        img.onload = resolve;
        img.onerror = resolve; // never block the export on a chart fail
        img.src = chartUrl;
      });
      const chartX = padX, chartY = cardTop + 200;
      const chartW = W - padX * 2;
      ctx.drawImage(img, chartX, chartY, chartW, chartH);
    }
  }

  // ── Footer ──────────────────────────────────────────────────────────────
  const footerY = H - 50;
  ctx.strokeStyle = 'rgba(44,50,84,.12)';
  ctx.beginPath();
  ctx.moveTo(padX, footerY - 28);
  ctx.lineTo(W - padX, footerY - 28);
  ctx.stroke();

  ctx.fillStyle = MUTE;
  ctx.font = `600 13px ${DISPLAY}`;
  ctx.textAlign = 'left';
  ctx.fillText('ECONOMICSECURITYPROJECT.ORG', padX, footerY);
  ctx.textAlign = 'right';
  ctx.fillText(item.fred_id ? `SOURCE · FRED · ${item.fred_id}` : `SOURCE · ${item.source_note || 'DERIVED'}`, W - padX, footerY);

  // Trigger download
  await new Promise((resolve) => {
    canvas.toBlob((blob) => {
      if (!blob) return resolve();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${item.id}-${item.fred_id || 'derived'}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      resolve();
    }, 'image/png');
  });
}

function downloadCSV(item) {
  const header = 'date,value,units\n';
  const units = (item.units || '').replace(/"/g, '""');
  const body = item.data.map(r => `${r.date},${r.value},"${units}"`).join('\n');
  // Provenance goes at the BOTTOM, prefixed with `#`, so the column header is
  // line 1 (a clean rectangle). read_csv(comment="#") / pandas comment="#"
  // drop these lines regardless of position; a bare read still parses the data.
  const sourceLine = item.fred_id
    ? `# ${item.label} — FRED ${item.fred_id}\n# Source: https://fred.stlouisfed.org/series/${item.fred_id}\n`
    : `# ${item.label} — ${item.source_note || 'Derived from public data'}\n`;
  const csv = `${header}${body}\n\n${sourceLine}`;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${item.id}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Wide CSV for a Compare States panel: one date column, one column per
// pinned state. Values are the stored (nominal) series, matching the
// single-series exports — the Real toggle never changes what's exported.
function downloadCompareCSV(metric, seriesList) {
  const dates = Array.from(new Set(seriesList.flatMap(s => s.data.map(d => d.date)))).sort();
  const cols = seriesList.map(s => {
    const m = {};
    s.data.forEach(d => { m[d.date] = d.value; });
    return m;
  });
  const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const header = ['date', ...seriesList.map(s => esc(s.label))].join(',') + '\n';
  const body = dates.map(dt => [dt, ...cols.map(m => m[dt] ?? '')].join(',')).join('\n');
  // Provenance appended at the bottom (see downloadCSV) so the header is line 1.
  const sourceLine = `# ${metric.label}${metric.units ? ` (${metric.units})` : ''} — ${metric.source_label || 'public data'}\n`
    + (metric.source_url ? `# Source: ${metric.source_url}\n` : '');
  const csv = `${header}${body}\n\n${sourceLine}`;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${metric.id}-states.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Accept either an ISO date string ("2024-01-15") or a numeric timestamp (ms),
// since Chart.js tooltip callbacks pass parsed.x as a number.
function toJsDate(dateInput) {
  return typeof dateInput === 'number' ? new Date(dateInput) : new Date(dateInput + 'T12:00:00');
}
function fmtDate(dateInput, opts) {
  return toJsDate(dateInput).toLocaleDateString('en-US', opts || { year: 'numeric', month: 'short' });
}

// Bucket a series' typical spacing into a cadence, so a label for one
// observation doesn't imply more precision than the series has — "2019" for
// an annual reading, a full date for a weekly one, month+year otherwise.
// Uses the most common day-gap (ties broken toward the smaller gap) rather
// than e.g. the mean, so a handful of missing months (coffee, some BLS
// average-price series) or one long test fixture doesn't get misread as a
// different cadence — most gaps still land on the real one. Derived from
// the data itself, not a hand-maintained tag, so it can't drift if a
// series' actual publishing cadence changes.
function inferCadence(data) {
  // Fewer than two gaps can't reveal a repeating cadence — a single big gap
  // is as likely to be an anchor clamped back to a sparse series' first
  // reading as it is a genuinely annual series. Default to the common case.
  if (!data || data.length < 3) return 'monthly';
  const gaps = data.slice(1).map((d, i) => Math.round((new Date(d.date) - new Date(data[i].date)) / 86400000));
  const counts = new Map();
  gaps.forEach(g => counts.set(g, (counts.get(g) || 0) + 1));
  let best = gaps[0], bestCount = counts.get(best);
  for (const [g, c] of counts) {
    if (c > bestCount || (c === bestCount && g < best)) { best = g; bestCount = c; }
  }
  if (best <= 10) return 'weekly';
  if (best <= 45) return 'monthly';
  if (best <= 120) return 'quarterly';
  return 'annual';
}

// Format one observation's date at the precision its cadence supports — for
// chart tooltips and the "in .../as of ..." clauses in buildFactText. Anchor
// badges ("since Dec 2019") are a fixed reference point, not an observation,
// and keep using fmtDate directly.
// `opts` only applies to the monthly/quarterly fallback (passed through to
// fmtDate, same default as fmtDate itself) — weekly and annual always
// override it, since their whole point is a different level of precision.
function fmtObsDate(dateInput, data, opts) {
  const cadence = inferCadence(data);
  if (cadence === 'annual') return String(toJsDate(dateInput).getFullYear());
  if (cadence === 'weekly') return fmtDate(dateInput, { year: 'numeric', month: 'short', day: 'numeric' });
  return fmtDate(dateInput, opts);
}

// Change between the last reading at-or-before `fromDate` and the last
// reading at-or-before `toDate`. Null if either cutoff has no reading, or if
// both resolve to the very same observation — an annual series that hasn't
// published anything since `fromDate` isn't "unchanged," it's "no new data
// since," and a 0.0% badge would claim the former.
// Resolving the two cutoffs to observations is the half that percent and
// percentage-point changes share; splitting it out keeps them under one null
// contract instead of two hand-kept copies of the same rules.
function endpointsBetween(data, fromDate, toDate) {
  if (!data || data.length < 2) return null;
  const idxAt = (dateStr) => {
    const cutoff = new Date(dateStr);
    let idx = null;
    for (let i = 0; i < data.length; i++) {
      if (new Date(data[i].date) <= cutoff) idx = i;
      else break;
    }
    return idx;
  };
  const priorIdx = idxAt(fromDate);
  const curIdx = idxAt(toDate);
  if (priorIdx == null || curIdx == null || priorIdx === curIdx) return null;
  return { from: data[priorIdx].value, to: data[curIdx].value };
}

function pctChangeBetween(data, fromDate, toDate) {
  const pts = endpointsBetween(data, fromDate, toDate);
  if (!pts || pts.from === 0) return null;
  return ((pts.to - pts.from) / pts.from) * 100;
}

function pctChange(data, fromDate) {
  // Find value at-or-before fromDate; latest is last
  if (!data || data.length < 2) return null;
  return pctChangeBetween(data, fromDate, data[data.length - 1].date);
}

function valueAt(data, dateStr) {
  // Last value on or before dateStr
  if (!data || !data.length) return null;
  const cutoff = new Date(dateStr);
  let v = null;
  for (let i = 0; i < data.length; i++) {
    if (new Date(data[i].date) <= cutoff) v = data[i].value;
    else break;
  }
  return v;
}

function sliceFrom(data, fromDateStr) {
  const cutoff = new Date(fromDateStr);
  return data.filter(d => new Date(d.date) >= cutoff);
}

// One anchor, one observation. `anchorDate` returns a calendar date, but a
// series only publishes on its own schedule, and the two ways of landing that
// date on a reading disagreed:
//
//   · valueAt (the badges, Copy fact) takes the last reading ON OR BEFORE it.
//   · sliceFrom (the chart window, and so the baseline of every cumulative
//     %-change number) takes the first reading AT OR AFTER it.
//
// For a monthly series both land on Dec 2019 and nothing turns on it. For FHFA
// home prices, quarterly, "Pre-COVID" resolved to Q4 2019 in the badge and Q1
// 2020 in the headline, so one card published two answers to one question:
// Illinois read "+55.6%" in the headline above a badge reading "+56.3% since
// Dec '19". Annual January-dated series (ACS income, rent burden) do the same
// thing in the %-change view, splitting 2019 from 2020.
//
// The badge's reading is the defensible one and the label is why: a number
// captioned "since Dec 2019" must not measure from Jan 2020, and on the
// Pre-COVID anchor specifically, Q1 2020 is not pre-COVID. So every surface
// resolves the anchor here, to the last reading on or before it — clamping
// forward only when the anchor predates the series, which is what the chart and
// the fact sentence already did in that case.
function anchorObsDate(data, anchorId) {
  const raw = anchorDate(anchorId, data);
  if (!data || !data.length) return raw;
  const cutoff = new Date(raw);
  let hit = null;
  for (let i = 0; i < data.length; i++) {
    if (new Date(data[i].date) <= cutoff) hit = data[i].date; else break;
  }
  return hit || data[0].date;
}

// Build an SVG line path (used by the compare-view sparklines)
function linePath(points) {
  if (!points.length) return '';
  return points.map((p, i) => (i === 0 ? `M${p.x.toFixed(1)},${p.y.toFixed(1)}` : `L${p.x.toFixed(1)},${p.y.toFixed(1)}`)).join(' ');
}

function toPoints(data, w, h, opts = {}) {
  if (!data || data.length === 0) return [];
  const pad = opts.pad || 3;
  const vals = data.map(d => d.value);
  const min = opts.min ?? Math.min(...vals);
  const max = opts.max ?? Math.max(...vals);
  const range = max - min || 1;
  return data.map((d, i) => ({
    x: (i / (data.length - 1 || 1)) * w,
    y: h - pad - ((d.value - min) / range) * (h - pad * 2),
    v: d.value,
    date: d.date,
  }));
}

// Hours of work needed at avg hourly earnings to afford X
function hoursToAfford(price, wage) {
  if (!wage) return null;
  return price / wage;
}

// Convert a CPI level into a real-dollar price (illustrative anchor)
const REFERENCE_PRICES = {
  // Approx avg US weekly grocery bill for a family of 4 in 2025 ≈ $290 (USDA moderate plan, scaled)
  groceriesWeekly2025: 290,
  // Median US rent 2025 ≈ $1,540
  rentMonthly2025: 1540,
};

// For a CPI series, scale a reference price by the ratio of CPI(date) / CPI(2025-01)
function scaleByCPI(series, date, refPrice, anchorDate = '2025-01-01') {
  const at = valueAt(series, date);
  const anchor = valueAt(series, anchorDate);
  if (!at || !anchor) return null;
  return refPrice * (at / anchor);
}

// Six plain-language groups, named the way the audience talks (August 2026
// recut). Under the recut the category IS the picker group, so this is both the
// rail's group header and the card eyebrow. Order lives in CATEGORY_META in the
// app block, not here — it is editorial, not alphabetical.
const CATEGORY_LABELS = {
  housing: 'Rent & homes',
  groceries: 'Food',
  bills: 'Bills & getting around',
  health: 'Health & care',
  income: 'Paychecks & debt',
  overall: 'Overall inflation',
};
function categoryLabel(category) {
  // Fall back to the raw id, not to a plausible-looking group name. A series in
  // an unrecognized category should look obviously wrong on the card rather
  // than quietly wearing another group's label; the `known` sets in
  // data_contract.test.js and source_parity.test.js are the real guard.
  return CATEGORY_LABELS[category] || category || '';
}

// Press-release-ready sentence for the "Copy fact" button. Leads with the
// card's active range (opts.anchorId / opts.since) as a from→to construction
// with both endpoint readings, so the number can be checked; then appends
// whichever of the two message anchors (Jan 2025, Dec 2019) isn't already
// shown, and always names the source. Percent-unit series change in
// percentage points — "up 12%" on a rate is a percent-of-a-percent that
// fact-checkers flag. Index series quote % change only, never index levels.
function buildFactText(item, opts = {}) {
  const name = opts.factLabel || item.label;
  const data = item.data || [];
  const units = item.units || '';
  const isPctUnits = units.includes('%');
  const isIndex = item.rebase || /^Index/.test(units);
  const anchorId = opts.anchorId || '2019';
  const since = opts.since || anchorDate(anchorId, data);
  // "on Jul 27, 2026" reads right for a specific day; "in July 2026" or
  // "in 2019" reads right at every coarser cadence.
  const datePrep = inferCadence(data) === 'weekly' ? 'on' : 'in';

  // fmtVal drops denominators ("$ per Gallon" → "$3.12"); spell them back out
  // so the sentence stands alone. Payrolls arrive in thousands — say millions.
  const fmtQty = (v) => {
    if (/^thousands/i.test(units)) return `${(v / 1000).toFixed(1)} million`;
    const s = fmtVal(v, units);
    const per = units.match(/^\$ per (\w+)/i);
    if (per) return `${s} per ${per[1].toLowerCase()}`;
    if (/^weeks/i.test(units)) return `${s} weeks`;
    return s;
  };

  // Last reading at/before a date (data is sorted ascending)
  const ptAt = (dateStr) => {
    const cutoff = new Date(dateStr);
    let p = null;
    for (const d of data) { if (new Date(d.date) <= cutoff) p = d; else break; }
    return p;
  };

  // Endpoints of the active range: the anchor reading — clamped forward to
  // the first available reading when the anchor predates the series, the
  // same clamp the chart applies — and the latest reading.
  const latestPt = data.length ? data[data.length - 1] : null;
  let startPt = null;
  if (data.length >= 2) {
    startPt = ptAt(since) || data[0];
    if (startPt.date === latestPt.date) startPt = null;
  }

  // "up 4.2%" — or "up 1.1 percentage points" for %-unit series
  const changeWords = (from, to, ppWord) => {
    if (isPctUnits) {
      const pp = to - from;
      return Math.abs(pp) < 0.05 ? 'essentially unchanged'
        : `${pp >= 0 ? 'up' : 'down'} ${Math.abs(pp).toFixed(1)} ${ppWord}`;
    }
    if (!from) return null;
    const pct = ((to - from) / from) * 100;
    return Math.abs(pct) < 0.05 ? 'essentially unchanged'
      : `${pct >= 0 ? 'up' : 'down'} ${Math.abs(pct).toFixed(1)}%`;
  };

  // Main clause: what the card is showing right now. Colon form ("Eggs:
  // $4.12 per dozen in ...") sidesteps singular/plural verb agreement.
  let main;
  if (startPt && latestPt) {
    const chg = changeWords(startPt.value, latestPt.value, 'percentage points');
    if (isIndex) {
      main = chg ? `${name}: ${chg} since ${fmtObsDate(startPt.date, data)}, as of ${fmtObsDate(latestPt.date, data)}`
                 : `${name} (${fmtObsDate(latestPt.date, data)})`;
    } else {
      main = `${name}: ${fmtQty(latestPt.value)} ${datePrep} ${fmtObsDate(latestPt.date, data)}, `
        + (chg ? `${chg} from` : 'compared with')
        + ` ${fmtQty(startPt.value)} ${datePrep} ${fmtObsDate(startPt.date, data)}`;
    }
  } else if (latestPt || item.latest_value != null) {
    const v = latestPt ? latestPt.value : item.latest_value;
    const dt = latestPt ? latestPt.date : item.latest_date;
    main = (isIndex || v == null) ? `${name} (${fmtObsDate(dt, data)})` : `${name}: ${fmtQty(v)} ${datePrep} ${fmtObsDate(dt, data)}`;
  } else {
    main = name;
  }

  // The message anchors the active view isn't already showing
  const secondary = (fromDate, label) => {
    const p = ptAt(fromDate);
    if (!p || !latestPt || p.date === latestPt.date || (startPt && p.date === startPt.date)) return null;
    const chg = changeWords(p.value, latestPt.value, 'points');
    return chg ? `${chg} ${label}` : null;
  };
  const clauses = [];
  if (anchorId !== '2025') { const c = secondary('2025-01-01', 'since January 2025'); if (c) clauses.push(c); }
  if (anchorId !== '2019') { const c = secondary('2019-12-01', 'since December 2019'); if (c) clauses.push(c); }
  if (opts.realYear) clauses.push(`inflation-adjusted to ${opts.realYear} dollars, CPI-U`);
  const secondaries = clauses.length ? ` (${clauses.join('; ')})` : '';

  const src = item.fred_id
    ? `${item.source_note || 'FRED'} series ${item.fred_id}`
    : (item.source_note || 'federal data');
  const rankPart = opts.rankText ? ` — ${opts.rankText}` : '';
  return `${main}${secondaries}${rankPart}. Source: ${src}, via the Economic Security Project Affordability Tracker.`;
}

// Lazy loader for the split state payloads (data/states/*.js and
// data/state_metrics/*.js). Each file assigns into a window global; the
// promise resolving means that global is populated.
const _loadedFiles = {};
function loadDataFile(src) {
  if (!_loadedFiles[src]) {
    _loadedFiles[src] = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => { delete _loadedFiles[src]; reject(new Error('failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }
  return _loadedFiles[src];
}

// ── Real (inflation-adjusted) transform ─────────────────────────────────────
// One global Nominal/Real switch drives the whole page. "Real" deflates a
// series by CPI-U (all items) and re-expresses it in the latest month's
// dollars, the standard construction (same as our derived real-wage series):
//   real_t = nominal_t × CPI_latest / CPI_t
// so the newest point is unchanged and earlier points rise into today's
// dollars. Only dollar levels and price *indexes* can be deflated; rates (%),
// durations and counts are already normalized over time, so Real is a no-op for
// them. A few series arrive already inflation-adjusted (the Census real median
// income series, as published) — never double-deflate those. The derived
// real_hourly_earnings card used to be in this set; it was cut in the July 2026
// trim because the Real toggle applied to nominal hourly earnings produces the
// same series, so keeping both meant showing one line twice.
const ALREADY_REAL_IDS = new Set(['income', 'us_median_income']);
function isDeflatable(item) {
  if (!item) return false;
  if (item.already_real || ALREADY_REAL_IDS.has(item.id)) return false;
  const u = item.units || '';
  return u.includes('$') || /^Index/.test(u);
}
function toReal(series, cpi) {
  if (!series || !series.length || !cpi || !cpi.length) return series;
  const cpiLatest = cpi[cpi.length - 1].value;
  const byMonth = {};
  for (const p of cpi) byMonth[p.date.slice(0, 7)] = p.value;
  const deflAt = (date) => {
    const hit = byMonth[date.slice(0, 7)];
    if (hit != null) return hit;
    // nearest CPI observation on or before this date (cpi is sorted ascending)
    let best = null;
    for (const p of cpi) { if (p.date <= date) best = p.value; else break; }
    return best;
  };
  return series
    .map(d => { const c = deflAt(d.date); return c ? { date: d.date, value: d.value * (cpiLatest / c) } : null; })
    .filter(Boolean);
}
// Apply the global price type to a chart item's series, in place of item.data.
// Returns the (possibly deflated) array. `real` is priceType === 'real'.
function seriesForType(item, cpi, real) {
  return (real && isDeflatable(item)) ? toReal(item.data, cpi) : item.data;
}

// ── One rule for "how much did this move" ───────────────────────────────────
// A rate series moves in PERCENTAGE POINTS. The mortgage rate going from 3.68%
// to 6.66% has risen 3.0 pp; calling that "+81.0%" is the percent-of-a-percent
// fact-checkers flag, and it is a claim the tracker should never publish.
//
// Every surface that prints a change routes through these three helpers —
// the picker rows, the card headline, the dual anchor badges, the %-change
// view and the heatmap — so no two of them can print different answers for
// the same movement. buildFactText applies the same rule in prose.
function isRateSeries(item) { return !!item && (item.units || '').includes('%'); }

// Change from `base` to `v` in the unit the series actually moves in: points
// for a rate, percent for everything else. Null when a percent change has no
// base to divide by, or when either endpoint is missing.
function changeIn(base, v, rate) {
  if (!Number.isFinite(base) || !Number.isFinite(v)) return null;
  if (rate) return v - base;
  return base ? (v / base - 1) * 100 : null;
}

// "+3.0 pp" / "−12.4%". The minus is U+2212, matching the rest of the UI.
function fmtChange(v, rate) {
  return `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}${rate ? ' pp' : '%'}`;
}

// Change between two dates in the series' own unit, under pctChangeBetween's
// null contract (null when both cutoffs resolve to the same observation — an
// annual series with nothing new isn't "unchanged", it's "no new data since").
function changeBetween(data, fromDate, toDate, item) {
  if (!isRateSeries(item)) return pctChangeBetween(data, fromDate, toDate);
  const pts = endpointsBetween(data, fromDate, toDate);
  return pts ? pts.to - pts.from : null;
}

// The common case: anchor to latest reading.
function changeSince(data, fromDate, item) {
  if (!data || data.length < 2) return null;
  return changeBetween(data, fromDate, data[data.length - 1].date, item);
}

// The change number each row of the National picker carries, next to the name.
// It follows the page anchor and the Nominal/Real toggle rather than pinning to
// Dec 2019, so a row and the card it opens can never disagree: this is a
// fact-checking surface, and two different answers to the same question on one
// screen is the failure that matters here.
//
// Editorial rules, the same ones buildFactText applies:
//   · %-unit series move in PERCENTAGE POINTS — "up 12%" on a rate is a
//     percent-of-a-percent that fact-checkers flag.
//   · Index series quote % change only. They have no level worth showing, which
//     is why no row ever prints one.
//   · An anchor landing on the last reading returns '—', not "0.0%". An annual
//     series with nothing published since isn't "unchanged", it's "no new data
//     since", and a 0.0% badge would claim the former.
//
// The base comes from anchorObsDate, the same resolution the card's chart,
// headline and badges use, so a row and the card it opens cannot print two
// different answers even for a series that publishes nothing in the anchor
// month. An anchor predating the series clamps forward to its first reading.
function railChangeText(item, anchorId, priceType, cpi) {
  const data = seriesForType(item, cpi, priceType === 'real');
  if (!data || data.length < 2) return '—';
  const base = anchorObsDate(data, anchorId);
  const k = data.findIndex(d => d.date === base);
  if (k < 0 || k === data.length - 1) return '—';
  const rate = isRateSeries(item);
  const v = changeIn(data[k].value, data[data.length - 1].value, rate);
  return v == null ? '—' : fmtChange(v, rate);
}

// ── Card order: most recently added first (August 2026) ─────────────────────
// The National and My State grids used to render in taxonomy order — category
// order, alphabetical within. Clicking "Coffee" then inserted it into the Food
// block, which on a long selection put the new card several screens below the
// fold and read as "nothing happened". Newest-first costs a reshuffle of the
// cards already on screen; that trade was taken deliberately so a click always
// has a visible result.
//
// The order array IS the selection — the Set the picker reads is derived from
// it, never the other way round, so there is one source of truth. Adds land at
// the front; a bulk group add puts the whole group at the front in the order it
// was handed in (alphabetical), so the group reads top-down the way the rail
// lists it. Re-adding something already selected is a no-op rather than a jump
// to the front: the picker's rows are toggles, so "add" only ever fires on
// something that isn't there.
function selAdd(order, ids) {
  const have = new Set(order);
  return (Array.isArray(ids) ? ids : [ids]).filter(id => !have.has(id)).concat(order);
}
function selRemove(order, ids) {
  const drop = new Set(Array.isArray(ids) ? ids : [ids]);
  return order.filter(id => !drop.has(id));
}

// A card whose "measure from" window holds fewer than two readings has nothing
// to plot. An annual Census series measured from Jan 2025 when its last point
// is 2024 resolves back to that single 2024 observation, and Chart.js still
// paints a full y-axis around the one point — which reads as a broken chart
// rather than as missing data. Returns the two lines a blank panel prints, or
// null when there is a real series to draw.
//
// Takes the *displayed* series (deflated in Real mode), not item.data, so a
// series whose real-mode window is shorter than its nominal one is judged on
// what the reader is actually looking at.
function emptyWindowNote(srcData, visible, anchorId) {
  if (visible && visible.length >= 2) return null;
  const phrase = anchorById(anchorId).phrase;
  if (!srcData || !srcData.length) return { head: 'No data', sub: 'This series has no readings to chart.' };
  const last = srcData[srcData.length - 1].date;
  return {
    head: 'No data ' + phrase,
    sub: 'Last published ' + fmtObsDate(last, srcData) + '. Measure from an earlier date to chart this series.',
  };
}

Object.assign(window, {
  ESP, fmtVal, fmtDate, inferCadence, fmtObsDate, ordinal, pctChange, pctChangeBetween, valueAt, sliceFrom, downloadCSV, downloadCardAsPNG,
  downloadCompareCSV,
  linePath, toPoints, hoursToAfford, REFERENCE_PRICES, scaleByCPI, categoryLabel,
  ANCHORS, anchorById, anchorDate, anchorObsDate, buildFactText, loadDataFile,
  ALREADY_REAL_IDS, isDeflatable, toReal, seriesForType, railChangeText,
  isRateSeries, changeIn, fmtChange, changeSince, changeBetween,
  selAdd, selRemove, emptyWindowNote,
});

})();
</script>

// ── Copy-fact button (shared by all cards) ──────────────────────────────────
function CopyFactButton({ item, factLabel, priceType, cpiData, rankText, anchorId, since }) {
  const [copied, setCopied] = useState(false);
  // Build the sentence at render time so the hover tooltip previews exactly
  // what a click puts on the clipboard. Match it to what's on screen: deflate
  // first in real mode so the numbers line up with the chart the reader is
  // seeing, and anchorId/since carry the card's active range.
  const text = useMemo(() => {
    const realOn = priceType === 'real' && isDeflatable(item);
    const factItem = realOn ? { ...item, data: toReal(item.data, cpiData) } : item;
    const realYear = realOn && cpiData && cpiData.length ? cpiData[cpiData.length - 1].date.slice(0, 4) : null;
    return buildFactText(factItem, { factLabel, realYear, rankText, anchorId, since });
  }, [item, factLabel, priceType, cpiData, rankText, anchorId, since]);
  return (
    <button
      style={{ ...styles.smallBtn, ...(copied ? { background: '#2E7D5B', border: '1px solid #2E7D5B', color: PAPER } : {}) }}
      title={text}
      onClick={async () => {
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 1600);
        } catch (e) { window.prompt('Copy this fact:', text); }
      }}
      onMouseEnter={(e) => { if (!copied) { e.currentTarget.style.background = NAVY; e.currentTarget.style.color = PAPER; } }}
      onMouseLeave={(e) => { if (!copied) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = NAVY; } }}
    >{copied ? '✓ Copied' : 'Copy fact'}</button>
  );
}

// ── Interactive Chart.js card ───────────────────────────────────────────────
// Transparent background, soft area fill, hover tooltip. `overlayItem` draws
// a dashed national-comparison line (used on state cards). `displayMode`
// 'pct' rebases everything to cumulative % change since the anchor.
function ChartCard({ item, anchorId, displayMode, priceType, cpiData, overlayItem, factLabel, rankNote, rankText }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
