      <span style={{ display: 'flex', gap: 8, alignItems: 'center' }} data-export-hide>
        <button onClick={onCSV} style={styles.smallBtn} {...hover}>↓ CSV</button>
        <button onClick={onPNG} style={styles.smallBtn} {...hover}>↓ PNG</button>
      </span>
    </div>
  );
}

// One overlay-chart panel (US average + pinned states) for one metric. The
// multi-metric compare renders up to four of these side by side; the panel
// reads the already-lazy-loaded window.STATE_METRIC payload.
function CompareMetricPanel({ metric, data, pinned, names, anchorId, displayMode, priceType, cpiData, compact, failed }) {
  const panelRef = useRef(null);
  const md = window.STATE_METRIC ? window.STATE_METRIC[metric.id] : null;
  const metricReal = priceType === 'real' && isDeflatable({ id: metric.id, units: metric.units });
  const deflate = (arr) => metricReal ? toReal(arr, cpiData) : arr;

  // The US average is not drawn by default — it's pinnable like any state
  // (code 'US' reads the already-loaded national payload). `rawData` keeps
  // the undeflated series for the CSV export.
  const seriesList = [];
  const natItem = metric.national_id && data[metric.national_id];
  if (md) pinned.forEach((code, i) => {
    const s = code === 'US' ? (natItem ? { data: natItem.data } : null) : md.states[code];
    if (s) seriesList.push({ label: names[code] || code, color: PIN_COLORS[i % PIN_COLORS.length], data: deflate(s.data), rawData: s.data });
  });

  // A white data panel on the cream page, like the National/State card grid.
  // The old transparent + hairline-on-top treatment let the chart sit directly
  // on the page; under the cream/white split that would leave the Compare tab
  // as the one place where charts are NOT on white.
  return (
    <div ref={panelRef} style={{ background: SURFACE, border: `1px solid rgba(44,50,84,.16)`, padding: '14px 16px 10px', minWidth: 0 }}>
      {compact && (
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 10, marginBottom: 8 }}>
          <span style={{ fontFamily: 'Publico, Georgia, serif', fontSize: 17, fontWeight: 600, color: INK }}>{metric.label}</span>
          <span style={{
            fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', fontSize: 10, color: SOFT,
            textTransform: 'uppercase', letterSpacing: '.06em', textAlign: 'right',
          }}>
            {metric.frequency}
          </span>
        </div>
      )}
      {failed ? (
        <div style={{ padding: '40px 0', textAlign: 'center', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
          Could not load this metric.
        </div>
      ) : !md ? (
        <div style={{ padding: '40px 0', textAlign: 'center', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
          Loading…
        </div>
      ) : seriesList.length === 0 ? (
        <div style={{ padding: '40px 0', textAlign: 'center', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
          Add a state to draw the comparison.
        </div>
      ) : (
        <CompareChart metric={metric} seriesList={seriesList} anchorId={anchorId}
                      displayMode={displayMode} height={compact ? 250 : 340} />
      )}

      {/* Footer — same shape as the national cards: source link left,
          CSV/PNG export buttons right (no Copy-fact for multi-state panels) */}
      {!failed && md && (
        <div style={{
          fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
          fontSize: 9, color: SOFT, letterSpacing: '.1em',
          textTransform: 'uppercase',
          marginTop: 12, paddingTop: 8, borderTop: `1px solid rgba(44,50,84,.1)`,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12,
        }}>
          {metric.source_url ? (
            <a
              href={metric.source_url}
              target="_blank"
              rel="noopener noreferrer"
              onClick={handleSourceLinkClick}
              style={{ color: SOFT, textDecoration: 'none', borderBottom: '1px dotted rgba(44,50,84,.3)' }}
              onMouseEnter={(e) => { e.currentTarget.style.color = NAVY; }}
              onMouseLeave={(e) => { e.currentTarget.style.color = SOFT; }}
            >
              Source · {metric.source_label} ↗
            </a>
          ) : (
            <span>Source · {metric.source_label || 'Derived from public data'}</span>
          )}
          {seriesList.length > 0 && (
            <span style={{ display: 'flex', gap: 8, alignItems: 'center' }} data-export-hide>
              <button
                onClick={() => downloadCompareCSV(metric, seriesList.map(s => ({ label: s.label, data: s.rawData })))}
                style={styles.smallBtn}
                onMouseEnter={(e) => { e.currentTarget.style.background = NAVY; e.currentTarget.style.color = PAPER; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = NAVY; }}
              >↓ CSV</button>
              <button
                onClick={async () => {
                  const chartCanvas = panelRef.current?.querySelector('canvas');
                  try {
                    await downloadCardAsPNG({
                      chartCanvas,
                      item: {
                        id: `${metric.id}-states`,
                        label: metric.label,
                        eyebrow: 'Compare States',
                        source_note: metric.source_label,
                      },
                      accent: metric.color,
                      headlineText: '',
                      changeText: '',
                      changeColor: metric.color,
                      rangeLabel: anchorById(anchorId).phrase,
                      legend: seriesList.map(s => ({ label: s.label, color: s.color })),
                    });
                  } catch (err) { console.error('PNG export failed', err); }
                }}
                style={styles.smallBtn}
                onMouseEnter={(e) => { e.currentTarget.style.background = NAVY; e.currentTarget.style.color = PAPER; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = NAVY; }}
              >↓ PNG</button>
            </span>
          )}
        </div>
      )}
    </div>
  );
}

function CompareView({ data, metricIds, setMetricIds, homeState, anchorId, displayMode, priceType }) {
  const idx = window.AFFORDABILITY_STATES;
  const cpiData = data.cpi_all_items ? data.cpi_all_items.data : null;
  // Defaults to California + Illinois pinned, not just the home state.
  const [pinned, setPinned] = useState(() => [...new Set([homeState, 'IL'].filter(Boolean))]);
  // Bumped as each state_metrics/{id}.js lands; failures tracked per id.
  const [, setLoadTick] = useState(0);
  const [failedIds, setFailedIds] = useState(() => new Set());
  // The picker's filter string, same as the other tabs. Selection itself is
  // `metricIds`, held by AppMain because the deep link carries it.
  const [q, setQ] = useState('');

  useEffect(() => {
    let live = true;
    metricIds.forEach(id => {
      loadDataFile(`data/state_metrics/${id}.js`)
        .then(() => { if (live) setLoadTick(t => t + 1); })
        .catch(() => { if (live) setFailedIds(prev => new Set(prev).add(id)); });
    });
    return () => { live = false; };
  }, [metricIds.join(',')]);

  if (!idx) return null;
  // Multi-select with no cap: clicking adds a panel, clicking again removes it.
  // The last one can't be removed — a Compare tab with no panels has nothing to
  // show, which is why the picker runs in 'keep-one' mode (no Clear).
  const metrics = metricIds.map(id => idx.metrics.find(m => m.id === id)).filter(Boolean);
  const metric = metrics[0] || idx.metrics[0];
  const toggleMetric = (id) => {
    if (metricIds.includes(id)) {
      if (metricIds.length > 1) setMetricIds(metricIds.filter(m => m !== id));
    } else {
      setMetricIds([...metricIds, id]);
    }
  };

  // ── The picker ────────────────────────────────────────────────────────────
  const groups = allStatesPickerGroups(idx.metrics, data);
  const idsIn = (catId) => {
    const g = groups.find(x => x.id === catId);
    return g ? g.items.map(i => i.id) : [];
  };
  const catState = (catId) => {
    const ids = idsIn(catId);
    const on = ids.filter(id => metricIds.includes(id)).length;
    return on === 0 ? 'none' : on === ids.length ? 'all' : 'some';
  };
  // Additive, like everywhere else — but removing a whole group must not empty
  // the view. If a group holds everything currently selected, removing it is a
  // no-op rather than a Compare tab with nothing on it.
  const toggleCategory = (catId) => {
    const ids = idsIn(catId);
    if (catState(catId) === 'all') {
      const left = metricIds.filter(id => !ids.includes(id));
      if (left.length) setMetricIds(left);
    } else {
      setMetricIds([...metricIds, ...ids.filter(id => !metricIds.includes(id))]);
    }
  };
  const picker = (variant) => (
    <MetricPicker
      variant={variant} mode="keep-one" groups={groups} total={idx.metrics.length}
      selectedIds={new Set(metricIds)} q={q} setQ={setQ}
      toggleId={toggleMetric} toggleCategory={toggleCategory} catState={catState}
      anchorId={anchorId} priceType={priceType} cpiData={cpiData}
    />
  );
  const md = window.STATE_METRIC ? window.STATE_METRIC[metric.id] : null;
  const primaryFailed = failedIds.has(metric.id);

  const names = { US: 'United States' };
  idx.states.forEach(s => { names[s.code] = s.name; });

  // No cap on pinned states — pin all 51 if you want. Colors cycle past the
  // palette length; the chips and tooltips still name every line.
  const togglePin = (code) => {
    setPinned(prev => prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code]);
  };

  // "+ Add" dropdown: the US average is just another option, listed first.
  let stateOptions = [];
  if (md) {
    stateOptions = Object.keys(md.states)
      .map(code => ({ code, name: names[code] || code }))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (metric.national_id && data[metric.national_id]) {
      stateOptions.unshift({ code: 'US', name: 'United States' });
    }
  }

  const status = primaryFailed ? 'error' : (md ? 'ready' : 'loading');

  return (
    <React.Fragment>
      <div className="at-pad" style={{ padding: '20px 56px 56px' }}>
        {/* Same two picker containers as every other tab; CSS picks one. The
            full-width bar of metric pills this replaced is gone. */}
        <div className="at-nat-layout">
        <div className="at-rail">{picker('rail')}</div>

        <div style={{ minWidth: 0 }}>
        <div className="at-natmenu">{picker('menu')}</div>
        {status !== 'ready' || !md ? (
          <div style={{ padding: '48px 0', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
            {status === 'error' ? 'Could not load this metric.' : 'Loading state data…'}
          </div>
        ) : (
          <React.Fragment>
            <div className="at-section-head" style={styles.sectionHead}>
              <span style={styles.sectionTitle}>
                {metrics.length === 1 ? `${metric.label} — pick states to overlay` : `${metrics.length} metrics, side by side`}
              </span>
              <span className="at-section-dek" style={styles.sectionDek}>
                {metrics.length === 1 ? (
                  <React.Fragment>
                    {metric.source_url ? (
                      <a href={metric.source_url} target="_blank" rel="noopener noreferrer"
                         onClick={handleSourceLinkClick}
                         style={{ color: MUTE, textDecoration: 'none', borderBottom: '1px dotted rgba(44,50,84,.3)' }}>
                        {metric.source_label} ↗
                      </a>
                    ) : metric.source_label} · {metric.frequency}
                  </React.Fragment>
                ) : 'Same pinned states on every panel.'}
              </span>
            </div>

            {/* Pinned chips + add control */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 16 }}>
              {pinned.map((code, i) => (
                <button key={code} onClick={() => togglePin(code)} style={{
                  fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', fontSize: 12, fontWeight: 700,
                  display: 'inline-flex', alignItems: 'center', gap: 7,
                  padding: '6px 12px', borderRadius: 3, cursor: 'pointer',
                  border: `1.5px solid ${PIN_COLORS[i % PIN_COLORS.length]}`,
                  background: hexToRgba(PIN_COLORS[i % PIN_COLORS.length], 0.09), color: INK,
                }} title="Remove from chart">
                  <span style={{ width: 10, height: 10, borderRadius: 5, background: PIN_COLORS[i % PIN_COLORS.length] }} />
                  {names[code] || code} ✕
                </button>
              ))}
              <select
                value=""
                onChange={(e) => { if (e.target.value) togglePin(e.target.value); }}
                style={{ ...styles.select, padding: '7px 10px', fontSize: 13 }}
              >
                <option value="">+ Add a state…</option>
                {stateOptions.filter(r => !pinned.includes(r.code)).map(r => (
                  <option key={r.code} value={r.code}>{r.name}</option>
                ))}
              </select>
            </div>

            <div style={metrics.length === 1 ? {} : {
              display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: '20px 28px',
            }}>
              {metrics.map(m => (
                <CompareMetricPanel key={m.id} metric={m} data={data} pinned={pinned} names={names}
                                    anchorId={anchorId} displayMode={displayMode} priceType={priceType}
                                    cpiData={cpiData} compact={metrics.length > 1}
                                    failed={failedIds.has(m.id)} />
              ))}
            </div>

          </React.Fragment>
        )}
        </div>
        </div>
      </div>
    </React.Fragment>
  );
}

// ── Map view: the US choropleth as its own tab, one metric at a time ────────
// Levels only — the map (or its bar-chart alternate) paints the level for a
// selected year, and change over time lives on the pinned-states chart below,
// which carries its own anchor + Nominal/Real controls.
function MapView({ data, metricId, setMetricId, anchorId, setAnchorId, priceType, setPriceType }) {
  const idx = window.AFFORDABILITY_STATES;
  const cpiData = data.cpi_all_items ? data.cpi_all_items.data : null;
  const [chartKind, setChartKind] = useState('map');   // 'map' | 'bars'
  const [yearSel, setYearSel] = useState(null);         // null = latest available year
  const [chartMode, setChartMode] = useState('level');  // §02 pinned chart: 'level' | 'pct'
  const graphicRef = useRef(null);      // §01 map/bar container, for PNG export
  const pinnedChartRef = useRef(null);  // §02 chart container, for PNG export
  // Click-to-pin: clicking a state on the map adds it to the overlay chart
  // below (and outlines it on the map); clicking again removes it. Pins
  // survive metric switches so you can walk one set of states across metrics.
  const [pinned, setPinned] = useState([]);
  const togglePin = (code) => {
    setPinned(prev => prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code]);
  };
  const [, setLoadTick] = useState(0);
  const [failedIds, setFailedIds] = useState(() => new Set());
  const [q, setQ] = useState('');   // the picker's filter string

  // Index-unit metrics (rebase: true — home prices) are excluded here: the map
  // shows levels only, and FHFA index levels aren't comparable across states
  // (each state is indexed to its own 1980 base). They stay in the other views.
  // Resolved before the loader effect so a stale deep link (metric=home_prices)
  // lazy-loads the fallback metric, not the excluded one.
  const metricsSorted = idx ? idx.metrics.filter(m => !m.rebase).sort((a, b) => a.label.localeCompare(b.label)) : [];
  const metric = metricsSorted.find(m => m.id === metricId) || metricsSorted[0];
  const loadId = metric ? metric.id : null;

  useEffect(() => {
    if (!loadId) return;
    let live = true;
    loadDataFile(`data/state_metrics/${loadId}.js`)
      .then(() => { if (live) setLoadTick(t => t + 1); })
      .catch(() => { if (live) setFailedIds(prev => new Set(prev).add(loadId)); });
    return () => { live = false; };
  }, [loadId]);

  if (!idx || !metric) return null;
  const md = window.STATE_METRIC ? window.STATE_METRIC[metric.id] : null;
  const status = failedIds.has(metric.id) ? 'error' : (md ? 'ready' : 'loading');

  const names = {};
  idx.states.forEach(s => { names[s.code] = s.name; });

  // ── The picker ────────────────────────────────────────────────────────────
  // Single-select: clicking a row switches the measure, it never deselects, so
  // there is always exactly one on. `metricsSorted` is already the 13 the map
  // can paint (index levels excluded above), so the rail lists 13, not 14.
  //
  // The row numbers follow this tab's OWN anchor and Nominal/Real toggle, which
  // live down on the §02 chart controls rather than on the global bar (hidden
  // here). Worth knowing when reading a row: the number describes change over
  // time in the US series, while §01 above paints state levels for one year.
  const groups = allStatesPickerGroups(metricsSorted, data);
  const picker = (variant) => (
    <MetricPicker
      variant={variant} mode="single" menuLabel="Pick a measure"
      groups={groups} total={metricsSorted.length}
      selectedIds={new Set([metric.id])} q={q} setQ={setQ}
      toggleId={setMetricId}
      anchorId={anchorId} priceType={priceType} cpiData={cpiData}
    />
  );

  // Deflate dollar metrics when the Real toggle (on the §02 chart controls)
  // is on. No state CPI exists, so state values use the national CPI-U — the
  // standard fallback.
  const metricReal = priceType === 'real' && isDeflatable({ id: metric.id, units: metric.units });
  const deflate = (arr) => metricReal ? toReal(arr, cpiData) : arr;
  const annual = (metric.frequency || '').startsWith('Annual');

  // Years available for this metric (union across states), newest first. The
  // dropdown defaults to the latest year; within a year each state shows its
  // last reading, so monthly/quarterly series default to the latest month.
  let years = [];
  if (md) {
    const set = new Set();
    Object.keys(md.states).forEach(code => md.states[code].data.forEach(d => set.add(d.date.slice(0, 4))));
    years = Array.from(set).sort().reverse();
  }
  const year = yearSel && years.includes(yearSel) ? yearSel : years[0];

  let rows = [];
  if (md && year) {
    rows = Object.keys(md.states).map(code => {
      const d = deflate(md.states[code].data);
      let obs = null;
      for (let i = d.length - 1; i >= 0; i--) {         // data is date-ascending
        const y = d[i].date.slice(0, 4);
        if (y === year) { obs = d[i]; break; }
        if (y < year) break;
      }
      return {
        code,
        name: names[code] || code,
        value: obs ? obs.value : null,
        obsDate: obs ? obs.date : null,
        obsLabel: obs ? (annual ? year : fmtDate(obs.date)) : null,
        rank: null, rankN: null,
      };
    });
    // Ranks on the selected year's values, 1 = highest; ties share a rank.
    // Build-time ranks only cover the latest value, so rank client-side here.
    const ranked = rows.filter(r => r.value != null).sort((a, b) => b.value - a.value);
    ranked.forEach((r, i) => {
      r.rank = (i > 0 && r.value === ranked[i - 1].value) ? ranked[i - 1].rank : i + 1;
      r.rankN = ranked.length;
    });
  }

  const periodLabel = `${metric.label} — ${year || ''}${!annual && year && year === years[0] ? ' (latest month)' : ''}`;

  // §01 exports: CSV is the selected year's per-state values as shown; PNG
  // rasterizes whichever graphic is up (map or bar list) into the branded card.
  const exportYearCSV = () => downloadStateYearCSV(metric, rows, year, metricReal);
  const exportPanelPNG = async () => {
    try {
      const scale = makeLevelScale(rows.map(r => r.value));
      let chartCanvas, chartH = 540;
      if (chartKind === 'map') {
        const svgEl = graphicRef.current ? graphicRef.current.querySelector('svg[viewBox="0 0 975 610"]') : null;
        if (!svgEl) return;
        chartCanvas = await mapToExportCanvas(svgEl, scale, metric);
      } else {
        const out = barsToExportCanvas(rows, scale, metric);
        chartCanvas = out.canvas; chartH = out.chartH;
      }
      await downloadCardAsPNG({
        chartCanvas, chartH,
        item: {
          id: `${metric.id}-states-${year}`,
          label: metric.label,
          eyebrow: `All States · ${year}`,
          source_note: metric.source_label,
        },
        accent: metric.color,
        headlineText: '', changeText: '', changeColor: metric.color,
        rangeLabel: '', legend: null,
      });
    } catch (err) { console.error('PNG export failed', err); }
  };

  // §02 exports: CSV is the pinned states' full series (stored nominal values,
  // matching every other multi-state export); PNG captures the chart canvas.
  const exportPinnedCSV = () => {
    if (!md) return;
    downloadCompareCSV(metric, pinned
      .map(code => md.states[code] ? { label: names[code] || code, data: md.states[code].data } : null)
      .filter(Boolean));
  };
  const exportPinnedPNG = async () => {
    try {
      const chartCanvas = pinnedChartRef.current ? pinnedChartRef.current.querySelector('canvas') : null;
      if (!chartCanvas) return;
      await downloadCardAsPNG({
        chartCanvas,
        item: {
          id: `${metric.id}-pinned-states`,
          label: metric.label,
          eyebrow: 'Pinned States',
          source_note: metric.source_label,
        },
        accent: metric.color,
        headlineText: '', changeText: '', changeColor: metric.color,
        rangeLabel: anchorById(anchorId).phrase,
        legend: pinned.map((code, i) => ({ label: names[code] || code, color: PIN_COLORS[i % PIN_COLORS.length] })),
      });
    } catch (err) { console.error('PNG export failed', err); }
  };

  return (
    <React.Fragment>
      <div className="at-pad" style={{ padding: '20px 56px 56px' }}>
        {/* The rail sits beside the map, as on every other tab. It costs the
            choropleth 220px of width; the SVG scales, and one control in one
            place across four tabs is worth more than the pixels. The bar of
            measure pills this replaced is gone. */}
        <div className="at-nat-layout">
        <div className="at-rail">{picker('rail')}</div>

        <div style={{ minWidth: 0 }}>
        <div className="at-natmenu">{picker('menu')}</div>
        {status !== 'ready' || !md ? (
          <div style={{ padding: '48px 0', fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE }}>
            {status === 'error' ? 'Could not load this metric.' : 'Loading state data…'}
          </div>
        ) : (
          <React.Fragment>
            <div className="at-section-head" style={styles.sectionHead}>
              <span style={styles.sectionTitle}>All states — {metric.label}</span>
              <span className="at-section-dek" style={styles.sectionDek}>
                {metric.source_url ? (
                  <a href={metric.source_url} target="_blank" rel="noopener noreferrer"
                     onClick={handleSourceLinkClick}
                     style={{ color: MUTE, textDecoration: 'none', borderBottom: '1px dotted rgba(44,50,84,.3)' }}>
                    {metric.source_label} ↗
                  </a>
                ) : metric.source_label} · {metric.frequency} · click any state to pin it on the chart below.
              </span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 6, marginLeft: 16, flexWrap: 'wrap' }}>
                <button onClick={() => setChartKind('map')} style={styles.modeBtn(chartKind === 'map')}>Map</button>
                <button onClick={() => setChartKind('bars')} style={styles.modeBtn(chartKind === 'bars')}>Bar chart</button>
                <select value={year || ''} onChange={(e) => setYearSel(e.target.value)} aria-label="Year"
                  style={{ ...styles.select, fontSize: 12, fontWeight: 700, padding: '5px 8px', marginLeft: 6 }}>
                  {years.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </span>
            </div>

            <div ref={graphicRef}>
              {chartKind === 'map' ? (
                <USMap metric={metric} rows={rows} pinned={pinned} onPick={togglePin} periodLabel={periodLabel} />
              ) : (
                <StateBarList metric={metric} rows={rows} pinned={pinned} onPick={togglePin} periodLabel={periodLabel} />
              )}
            </div>

            <ExportFooter metric={metric} onCSV={exportYearCSV} onPNG={exportPanelPNG} />

            <div style={{
              marginTop: 14, fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic',
              fontSize: 12.5, color: MUTE,
            }}>
              Values are levels for {year}{annual ? '' : "; monthly and quarterly measures use each state's last reading in that year"}. Ranks are on the same values (1 = highest — direction-neutral: highest rent is bad, highest income is good).
              {metric.id === 'rent' && ' State rents aggregate Zillow county data with renter-household weights; states where coverage falls below half of renter households are omitted.'}
            </div>

            {/* Click-to-pin overlay chart: every state clicked on the map or
                bar chart is drawn here over time, as levels (default) or
                % change — the graphic above is a single-period snapshot, this
                is where time series live. The anchor + Nominal/Real + View
                controls sit here (not on the global bar) because in the Map
                view they only shape this chart. */}
            <div className="at-section-head" style={{ ...styles.sectionHead, marginTop: 44 }}>
              <span style={styles.sectionTitle}>
                {pinned.length
                  ? `${metric.label} — ${pinned.length} ${pinned.length === 1 ? 'state' : 'states'} pinned`
                  : 'Pin states to chart them over time'}
              </span>
              <span className="at-section-dek" style={styles.sectionDek}>
                Click states above to add them; click a state or its chip to remove it.
              </span>
            </div>
            {pinned.length === 0 ? (
              <div style={{
                background: SURFACE, border: `1px solid rgba(44,50,84,.18)`,
                padding: '36px 32px', textAlign: 'center',
                fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', color: MUTE,
              }}>
                Click any state above to chart it over time — levels or % change.
              </div>
            ) : (
              <React.Fragment>
                <div style={{
                  display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap',
                  background: MENU_BG, border: '1px solid rgba(44,50,84,.15)',
                  padding: '12px 16px', marginBottom: 16,
                }}>
                  <span style={styles.controlLabel}>Measure from</span>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
                    {ANCHORS.map(a => (
                      <button key={a.id} onClick={() => setAnchorId(a.id)} style={styles.anchorBtn(a.id === anchorId)} title={a.title}>
                        {a.label}
                      </button>
                    ))}
                    <YearAnchorSelect anchorId={anchorId} setAnchorId={setAnchorId} />
                  </div>
                  <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={styles.controlLabel}>Type</span>
                      <span style={{ display: 'flex' }}>
                        <button onClick={() => setPriceType('nominal')} style={styles.modeBtn(priceType === 'nominal')}>Nominal</button>
                        <button onClick={() => setPriceType('real')} style={styles.modeBtn(priceType === 'real')}>Real</button>
                      </span>
                    </span>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={styles.controlLabel}>View</span>
                      <span style={{ display: 'flex' }}>
                        <button onClick={() => setChartMode('level')} style={styles.modeBtn(chartMode === 'level')}>Levels</button>
                        <button onClick={() => setChartMode('pct')} style={styles.modeBtn(chartMode === 'pct')}>% change</button>
                      </span>
                    </span>
                  </span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 16 }}>
                  {pinned.map((code, i) => (
                    <button key={code} onClick={() => togglePin(code)} style={{
                      fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif', fontSize: 12, fontWeight: 700,
                      display: 'inline-flex', alignItems: 'center', gap: 7,
                      padding: '6px 12px', borderRadius: 3, cursor: 'pointer',
                      border: `1.5px solid ${PIN_COLORS[i % PIN_COLORS.length]}`,
                      background: hexToRgba(PIN_COLORS[i % PIN_COLORS.length], 0.09), color: INK,
                    }} title="Remove from chart">
                      <span style={{ width: 10, height: 10, borderRadius: 5, background: PIN_COLORS[i % PIN_COLORS.length] }} />
                      {names[code] || code} ✕
                    </button>
                  ))}
                  <button onClick={() => setPinned([])}
                    style={{ ...styles.smallBtn, border: 'none', textDecoration: 'underline', textUnderlineOffset: 3, fontSize: 10 }}
                  >Clear all</button>
                </div>
                <div ref={pinnedChartRef} style={{ background: SURFACE, border: `1px solid rgba(44,50,84,.16)`, padding: '14px 16px 10px' }}>
                  <CompareChart
                    metric={metric}
                    seriesList={pinned.map((code, i) => {
                      const s = md.states[code];
                      if (!s) return null;
                      return { label: names[code] || code, color: PIN_COLORS[i % PIN_COLORS.length], data: deflate(s.data) };
                    }).filter(Boolean)}
                    anchorId={anchorId} displayMode={chartMode} height={340} />
                </div>
                <div style={{
                  marginTop: 10, fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic',
                  fontSize: 12.5, color: MUTE,
                }}>
                  Lines show {chartMode === 'pct' ? '% change' : 'levels'} {anchorById(anchorId).phrase}{metricReal ? ', inflation-adjusted with the national CPI-U (no state price index exists)' : ''}.
                </div>
                <ExportFooter metric={metric} onCSV={exportPinnedCSV} onPNG={exportPinnedPNG} />
              </React.Fragment>
            )}
          </React.Fragment>
        )}
        </div>
        </div>
      </div>
    </React.Fragment>
  );
}

// A few metrics (currently only the derived "Rent in Hours of Work") have no
// single external primary source — their source_url is the relative
// "about.html" link to this tracker's own methods page. Opening that as a
// plain target="_blank" anchor dumps the reader on the bare, chrome-less
// about.html file instead of the in-app About view every other "About the
// data" link uses. Anchors that carry this href call this on click so
// AppMain (which owns the in-app About navigation) can intercept it instead
// of letting the browser navigate/open a new tab.
function handleSourceLinkClick(e) {
  if (e.currentTarget.getAttribute('href') === 'about.html') {
    e.preventDefault();
    window.dispatchEvent(new CustomEvent('at-open-about'));
  }
}

// ── Shell ────────────────────────────────────────────────────────────────────
function parseHash() {
  const out = {};
  const h = (window.location.hash || '').replace(/^#/, '');
  h.split('&').forEach(kv => {
    const [k, v] = kv.split('=');
    if (k && v) out[decodeURIComponent(k)] = decodeURIComponent(v);
  });
  return out;
}

// Custom start-year picker for the "Measure from" bars. Fills the gap between
// the presets (e.g. "since 2010", "since 2021") without adding an end-date
// control — the x-axis always ends at the latest reading. Styled to match
// anchorBtn; a chosen year sets the synthetic "y:YYYY" anchor.
function YearAnchorSelect({ anchorId, setAnchorId }) {
  const isCustom = typeof anchorId === 'string' && anchorId.slice(0, 2) === 'y:';
  const curYear = new Date().getFullYear();
  const years = [];
  for (let y = curYear; y >= 2000; y--) years.push(y);
  return (
    <span style={{ position: 'relative', display: 'inline-flex' }}>
      <select
        value={isCustom ? anchorId.slice(2) : ''}
        onChange={(e) => { if (e.target.value) setAnchorId('y:' + e.target.value); }}
        title="Measure from a custom start year"
        style={{
          ...styles.anchorBtn(isCustom),
          appearance: 'none', WebkitAppearance: 'none', MozAppearance: 'none',
          paddingRight: 24, lineHeight: 1.2,
        }}
      >
        <option value="" disabled>Year…</option>
        {years.map(y => <option key={y} value={y}>{y}</option>)}
      </select>
      <span style={{
        position: 'absolute', right: 9, top: '50%', transform: 'translateY(-50%)',
        pointerEvents: 'none', display: 'inline-flex', alignItems: 'center',
      }}>
        <svg width="10" height="7" viewBox="0 0 11 8" fill="none" aria-hidden="true">
          <path d="M1 1.5L5.5 6L10 1.5" stroke={isCustom ? PAPER : NAVY} strokeWidth="1.75"
            strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </span>
    </span>
  );
}

// In-app About view, both modes (in embed the iframe must never navigate to
// about.html — no height script, no embed chrome). The sources & methods
// content lives in assets/about_content.js — a script payload shared with
// about.html, lazy-loaded the same way as the data/*.js files (works on
// file:// too, where fetch() is blocked) — injected under .at-about styles.
function AboutView({ onBack }) {
  const [html, setHtml] = useState(window.ABOUT_CONTENT || null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (html) return;
    loadDataFile('assets/about_content.js')
      .then(() => {
        if (!window.ABOUT_CONTENT) throw new Error('about_content.js defined nothing');
        setHtml(window.ABOUT_CONTENT);
      })
      .catch(() => setFailed(true));
  }, []);

  const backBtn = (
    <button onClick={onBack} style={{
      background: 'none', border: 'none', cursor: 'pointer', padding: '1px 0',
      fontFamily: "'Public Sans', system-ui, sans-serif",
      fontSize: 11, letterSpacing: '.16em', textTransform: 'uppercase', fontWeight: 600,
      color: NAVY, borderBottom: '1px dotted rgba(44,50,84,.45)',
    }}>← Back to the tracker</button>
  );

  return (
    <div className="at-pad" style={{ padding: '34px 56px 40px' }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
        gap: 12, flexWrap: 'wrap', marginBottom: 10,
      }}>
        <h2 style={{
          fontFamily: "'Public Sans', system-ui, sans-serif", fontSize: 34, fontWeight: 600,
          letterSpacing: '-.01em', margin: 0,
        }}>About the data.</h2>
        {backBtn}
      </div>
      <p style={{
        fontFamily: "'Public Sans', system-ui, sans-serif",
        fontSize: 16, lineHeight: 1.6, color: MUTE, maxWidth: 900, margin: '0 0 30px',
      }}>
        Every figure on the tracker comes from a public source, with the series identifier a
        click away. Below: where each number comes from, how often it updates, how it's
        calculated, and what it can and can't be used to say.
      </p>
      {failed ? (
        <p style={{ fontSize: 14, lineHeight: 1.6 }}>
          The sources &amp; methods page couldn't be loaded here.{' '}
          <a href="about.html" target="_blank" rel="noopener" style={{ color: NAVY }}>
            Open it in a new tab →</a>
        </p>
      ) : html ? (
        <div className="at-about" dangerouslySetInnerHTML={{ __html: html }} />
      ) : (
        <p style={{ fontSize: 14, color: MUTE }}>Loading sources &amp; methods…</p>
      )}
      {html && <div style={{ marginTop: 36 }}>{backBtn}</div>}
    </div>
  );
}

function AppMain({ data }) {
  const idx = window.AFFORDABILITY_STATES;
  const hash = useMemo(parseHash, []);
  const realBaseYear = data.cpi_all_items && data.cpi_all_items.data.length
    ? data.cpi_all_items.data[data.cpi_all_items.data.length - 1].date.slice(0, 4) : '';
  const validState = (c) => c === 'US' || (idx && idx.states.some(s => s.code === c));
  const validMetric = (m) => idx && idx.metrics.some(x => x.id === m);

  const [view, setView] = useState(
    ['national', 'state', 'compare', 'map', 'about'].includes(hash.view) &&
    (['national', 'about'].includes(hash.view) || idx) ? hash.view : 'national');
  // About opens in-app in both modes (in embed the iframe must never navigate
  // to about.html, which has no height script or embed chrome; standalone gets
  // the same behavior for one navigation model). about.html itself stays live
  // for direct links. The href is kept so middle-click/new-tab still works.
  const [aboutReturnView, setAboutReturnView] = useState('national');
  const openAbout = (e) => {
    e.preventDefault();
    if (view !== 'about') setAboutReturnView(view);
    setView('about');
  };
  const aboutProps = { onClick: openAbout };
  // Card "view source" links for derived metrics (e.g. Rent in Hours of
  // Work) that point at about.html dispatch this instead of navigating —
  // see handleSourceLinkClick — so they open the in-app About view like
  // every other "About the data" link rather than a bare new tab.
  useEffect(() => {
    const onOpenAbout = () => openAbout({ preventDefault() {} });
    window.addEventListener('at-open-about', onOpenAbout);
    return () => window.removeEventListener('at-open-about', onOpenAbout);
  }, [view]);
  const validAnchor = (a) => ANCHORS.some(x => x.id === a) || /^y:\d{4}$/.test(a || '');
  const [anchorId, setAnchorId] = useState(validAnchor(hash.anchor) ? hash.anchor : '2019');
  const [displayMode, setDisplayMode] = useState(hash.mode === 'pct' ? 'pct' : 'level');
  const [priceType, setPriceType] = useState(hash.type === 'real' ? 'real' : 'nominal');
  const [stateCode, setStateCode] = useState(validState(hash.state) ? hash.state : 'CA');
  // Both state-metric views default to the ACA benchmark premium (comms request).
  const defaultMetric = validMetric('aca_benchmark_premium') ? 'aca_benchmark_premium'
    : (idx && idx.metrics[0] ? idx.metrics[0].id : 'unemployment');
  // Compare view supports any number of metrics (comma-separated in the hash).
  // Defaults to the same four metrics as My State (electricity, rent, ACA
  // premium, real median income) rather than the ACA premium alone.
  const [metricIds, setMetricIds] = useState(() => {
    const fromHash = (hash.metric || '').split(',').filter(validMetric);
    if (fromHash.length) return fromHash;
    const defaults = STATE_DEFAULT_METRICS.filter(validMetric);
    return defaults.length ? defaults : [defaultMetric];
  });
  // The Map view shows exactly one metric at a time.
  const [mapMetricId, setMapMetricId] = useState(() => {
    const first = (hash.metric || '').split(',')[0];
    if (hash.view === 'map' && validMetric(first)) return first;
    return defaultMetric;
  });

  // Deep links: a campaigner can send a colleague straight to their state.
  useEffect(() => {
    const parts = [`view=${view}`, `anchor=${anchorId}`];
    if (displayMode === 'pct') parts.push('mode=pct');
    if (priceType === 'real') parts.push('type=real');
    if (view === 'state') parts.push(`state=${stateCode}`);
    if (view === 'compare') { parts.push(`metric=${metricIds.join(',')}`); }
    if (view === 'map') { parts.push(`metric=${mapMetricId}`); }
    window.history.replaceState(null, '', '#' + parts.join('&'));
  }, [view, anchorId, displayMode, priceType, stateCode, metricIds, mapMetricId]);

  // Entering or leaving the About view replaces the whole content area, so
  // bring the top of the app back into view. scrollIntoView propagates to the
  // ESP parent page's scroll even cross-origin, unlike window.scrollTo.
  const rootRef = useRef(null);
  const lastViewRef = useRef(view);
  useEffect(() => {
    const crossed = lastViewRef.current !== view &&
      (view === 'about' || lastViewRef.current === 'about');
    lastViewRef.current = view;
    if (crossed && rootRef.current) rootRef.current.scrollIntoView({ block: 'start' });
  }, [view]);

  const lastUpdated = (() => {
    const stamps = Object.values(data).map(d => d.last_updated).filter(Boolean).sort();
    return stamps.length ? stamps[stamps.length - 1] : null;
  })();

  const VIEWS = [
    { id: 'national', label: 'National' },
    ...(idx ? [
      { id: 'state',   label: 'My State' },
      { id: 'compare', label: 'Compare States' },
      { id: 'map',     label: 'Map' },
    ] : []),
  ];

  return (
    <div ref={rootRef} style={styles.root}>
      {/* Standalone chrome: navy top bar + hero. Hidden in embed mode — the
          ESP site header takes their place and the tabs move below. */}
      {!EMBED && (
        <div className="at-pad" style={styles.topbar}>
          <span>Economic Security Project</span>
          <a href="about.html" {...aboutProps} style={{
            color: PAPER, textDecoration: 'none',
            borderBottom: view === 'about' ? '1px solid #FFFDF2' : '1px dotted rgba(244,242,228,.5)',
            paddingBottom: 1,
          }}>About the data →</a>
        </div>
      )}

      {/* Masthead. Title/subtitle removed August 2026 — the hosted ESP page
          now carries them, so index.html no longer duplicates the name. */}
      {!EMBED && (
      <header className="at-pad at-hero" style={styles.hero}>
        {lastUpdated && (
          <div style={{
            marginTop: 22,
            fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
            fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase',
            color: 'rgba(244,238,225,.6)', fontWeight: 600,
          }}>
            Last updated · {new Date(lastUpdated + 'T12:00:00').toLocaleDateString('en-US', {
              year: 'numeric', month: 'long', day: 'numeric',
            })}
          </div>
        )}

        {/* View tabs */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginTop: 38 }}>
          {VIEWS.map(v => (
            <button key={v.id} onClick={() => setView(v.id)} style={styles.viewTab(view === v.id)}>
              {v.label}
            </button>
          ))}
        </div>
      </header>
      )}

      {/* Embed mode: title/subtitle removed August 2026 — the hosted ESP page
          now carries them. Just the tabs remain. */}
      {EMBED && (
        <div className="at-pad at-inset-rule" style={{
          background: MENU_BG,
          padding: '28px 56px 16px',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            {VIEWS.map(v => (
              <button key={v.id} onClick={() => setView(v.id)} style={styles.viewTabLight(view === v.id)}>
                {v.label}
              </button>
            ))}
            <span style={{
              marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap',
              fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
              fontSize: 11, letterSpacing: '.16em', textTransform: 'uppercase',
              color: MUTE, fontWeight: 600,
            }}>
              {lastUpdated && (
                <span>
                  Updated {new Date(lastUpdated + 'T12:00:00').toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric',
                  })}
                </span>
              )}
              <a href="about.html" {...aboutProps} style={{
                color: NAVY, textDecoration: 'none',
                borderBottom: view === 'about' ? '1px solid #2c3254' : '1px dotted rgba(44,50,84,.45)',
                paddingBottom: 1,
              }}>About the data →</a>
            </span>
          </div>
        </div>
      )}

      {/* Global controls: anchor + $/%. Hidden on the Map view — the map is
          levels-only with its own year dropdown, and the anchor + Nominal/Real
          controls live on its pinned-states chart instead — and on the About
          view, which has no charts. */}
      {view !== 'map' && view !== 'about' && (
      <div className="at-pad at-controls at-inset-rule" style={styles.controls}>
        <span style={styles.controlLabel}>Measure from</span>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
          {ANCHORS.map(a => (
            <button key={a.id} onClick={() => setAnchorId(a.id)} style={styles.anchorBtn(a.id === anchorId)}>
              {a.label}
            </button>
          ))}
          <YearAnchorSelect anchorId={anchorId} setAnchorId={setAnchorId} />
        </div>
        <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={styles.controlLabel}>Type</span>
            <span style={{ display: 'flex' }}>
              <button onClick={() => setPriceType('nominal')} style={styles.modeBtn(priceType === 'nominal')}>Nominal</button>
              <button onClick={() => setPriceType('real')} style={styles.modeBtn(priceType === 'real')}>Real</button>
            </span>
          </span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={styles.controlLabel}>View</span>
            <span style={{ display: 'flex' }}>
              <button onClick={() => setDisplayMode('level')} style={styles.modeBtn(displayMode === 'level')}>$ levels</button>
              <button onClick={() => setDisplayMode('pct')} style={styles.modeBtn(displayMode === 'pct')}>% change</button>
            </span>
          </span>
        </span>
      </div>
      )}

      {priceType === 'real' && view !== 'about' && (
        <div className="at-pad" style={{ padding: '10px 56px 0' }}>
          <div style={{ fontFamily: 'Publico, Georgia, serif', fontStyle: 'italic', fontSize: 12.5, color: MUTE }}>
            Real: dollar and price-index series are inflation-adjusted to {realBaseYear} dollars using CPI-U (all items).
            Rates, counts, and already-real series (income) are shown as published. State series use the national CPI-U — no state price index exists.
          </div>
        </div>
      )}

      {view === 'national' && <NationalView data={data} anchorId={anchorId} displayMode={displayMode} priceType={priceType} />}
      {view === 'state'    && <StateView data={data} code={stateCode} setCode={setStateCode}
                                         anchorId={anchorId} displayMode={displayMode} priceType={priceType} />}
      {view === 'compare'  && <CompareView data={data} metricIds={metricIds} setMetricIds={setMetricIds}
                                           homeState={stateCode} anchorId={anchorId} displayMode={displayMode} priceType={priceType} />}
      {view === 'map'      && <MapView data={data} metricId={mapMetricId} setMetricId={setMapMetricId}
                                       anchorId={anchorId} setAnchorId={setAnchorId}
                                       priceType={priceType} setPriceType={setPriceType} />}
      {view === 'about'    && <AboutView onBack={() => setView(aboutReturnView)} />}

      {/* Footer */}
      <div className="at-pad" style={{ padding: '0 56px 48px' }}>
        <div style={{
          paddingTop: 22, borderTop: `1px solid rgba(44,50,84,.2)`,
          fontFamily: '"Neue Haas Grotesk Display Pro", sans-serif',
          fontSize: 11, color: MUTE, letterSpacing: '.08em',
          textTransform: 'uppercase',
          display: 'flex', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap',
        }}>
          <span style={{ display: 'flex', gap: 18, flexWrap: 'wrap' }}>
            <a href="about.html" {...aboutProps} style={{ color: MUTE, textDecoration: 'underline', textUnderlineOffset: 3 }}>
              About the data: sources & methods
            </a>
            {/* Feedback route, on every view including the embed. Not a mailto:
                yet — FEEDBACK_EMAIL is a placeholder, and a mailto that opens a
                compose window addressed to nothing is worse than plain text. */}
            <span>Found an error? {FEEDBACK_EMAIL}</span>
          </span>
          <span style={{ textAlign: 'right' }}>
            Data: FRED · BLS · Census · FHFA · Zillow · Freddie Mac · EIA · NY Fed · KFF · Urban · CCAoA<br/>
            economicsecurityproject.org / affordability
          </span>
        </div>
      </div>
    </div>
  );
}

window.AppMain = AppMain;
})();
</script>

<script type="text/babel" data-presets="react">
(function() {
  const { useState, useEffect } = React;

  function App() {
    const data = window.AFFORDABILITY_DATA;
    const [ready, setReady] = useState(!!window.AppMain);
    useEffect(() => {
      if (ready) return;
      const t = setInterval(() => {
        if (window.AppMain) { setReady(true); clearInterval(t); }
      }, 80);
      return () => clearInterval(t);
    }, [ready]);

    // Cream text on the dark standalone surround; ink on the cream embed page.
    const loadColor = document.documentElement.classList.contains('embed') ? '#0E1320' : '#f4f2e4';
    if (!data) return <div style={{ color: loadColor, padding: 40, fontFamily: 'system-ui' }}>No data loaded.</div>;
    if (!ready) return <div style={{ color: loadColor, padding: 40, fontFamily: 'system-ui' }}>Loading…</div>;

    const Main = window.AppMain;
    return (
      <div id="stage">
        <Main data={data} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>

<script>
(function () {
  let previousHeight = 0;
  function sendDashboardHeight() {
    const bodyElements = Array.from(document.body.children).filter(
      function (element) {
        return element.tagName !== "SCRIPT" &&
               element.tagName !== "STYLE";
      }
    );
    const contentBottom = bodyElements.reduce(
      function (largestBottom, element) {
        const rectangle = element.getBoundingClientRect();
        const bottom = rectangle.bottom + window.scrollY;
        return Math.max(largestBottom, bottom);
      },
      0
    );
    const height = Math.ceil(
      Math.max(contentBottom, document.body.offsetHeight)
    );
    if (Math.abs(height - previousHeight) > 2) {
      previousHeight = height;
      window.parent.postMessage(
        {
          type: "esp-dashboard-height",
          height: height
        },
        "*"
      );
    }
  }
  window.addEventListener("load", sendDashboardHeight);
  window.addEventListener("resize", sendDashboardHeight);
  window.addEventListener("hashchange", function () {
    setTimeout(sendDashboardHeight, 100);
  });
  const resizeObserver = new ResizeObserver(function () {
    window.requestAnimationFrame(sendDashboardHeight);
  });
  resizeObserver.observe(document.body);
  setTimeout(sendDashboardHeight, 100);
  setTimeout(sendDashboardHeight, 500);
  setTimeout(sendDashboardHeight, 1500);
})();
</script>
