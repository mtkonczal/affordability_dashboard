<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Affordability Dashboard chart</title>
<!--
  Frozen charts for a blog-post iframe: chart.html?ids=<id>,<id>,<id> lays the
  charts side by side in one iframe (chart.html?id=<id> for a single chart).
  Reads ./data.js (window.EMBED_DATA), written by scripts/snapshot_embed.py.
  This file is the TEMPLATE; the script copies it into each embeds/<slug>/
  folder so a published post never changes when this file does.

  Deliberately small: no React, no Babel, no anchors or toggles. Hover
  tooltips, a CSV download and a PNG download per chart. A chart holds one
  line or a few that share units (gas and diesel). Fills whatever height the
  iframe gives it, so the WordPress snippet sets the height and no resize
  script is needed on the parent page. That is also why phones get a
  sideways-swipe row rather than stacked cards: stacking would change the
  height, and only a script on the parent page could follow it.

  The change rule matches index.html (isRateSeries / changeIn / fmtChange):
  percentage points for rate series, percent for everything else, and index
  series (rebase: true) plot as cumulative % change, never index levels.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* No page background: the post's own background shows in the gaps, so the
     three cards read as three panels on the page. */
  body { font-family: 'Public Sans', system-ui, sans-serif; color: #0E1320; }
  .row { height: 100%; display: flex; gap: 16px; }
  .card {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    background: #FFFFFF; border: 1px solid #E6E3D6;
    padding: 12px 12px 10px;
  }
  /* Phones: one card at a time with the next one peeking in, swiped sideways. */
  @media (max-width: 560px) {
    .row { overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px;
           -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .row:not(.n1) > .card { flex: 0 0 85%; scroll-snap-align: start; }
  }
  .title { font-size: 15px; font-weight: 700; line-height: 1.25; }
  .units { font-size: 12px; color: #6B6E78; margin-top: 2px; }
  .headline { margin-top: 6px; font-size: 22px; font-weight: 700; line-height: 1.1; }
  .headline span { font-size: 12px; font-weight: 400; color: #6B6E78; margin-left: 4px; }
  .keys { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .key { font-size: 13px; line-height: 1.3; display: flex; align-items: baseline; gap: 6px; }
  .key i { flex: none; width: 10px; height: 3px; border-radius: 2px; transform: translateY(-3px); }
  .key b { font-weight: 700; }
  .since { font-size: 12px; color: #6B6E78; margin-top: 2px; }
  .chart { position: relative; flex: 1; min-height: 120px; margin-top: 8px; }
  .foot { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px;
          align-items: center; justify-content: space-between; }
  .source { font-size: 11px; color: #6B6E78; line-height: 1.3; }
  .source a { color: inherit; }
  .buttons { display: flex; gap: 6px; }
  button {
    font: 600 11px 'Public Sans', system-ui, sans-serif;
    color: #2c3254; background: #FFFFFF;
    border: 1px solid #2c3254; border-radius: 3px;
    padding: 4px 8px; cursor: pointer;
  }
  button:hover { background: #2c3254; color: #FFFFFF; }
  .error { font-size: 13px; color: #6B6E78; margin: auto; text-align: center; }
  body > .error { margin-top: 40px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
(function () {
  'use strict';
  // Same table as ESP_CATEGORY_COLOR in index.html, for one-line charts.
  var CATEGORY_COLOR = {
    housing: '#2c3254', groceries: '#ebc382', bills: '#472b51',
    health: '#b0645f', income: '#70ad8f', overall: '#7f8c53'
  };
  // Two lines in one chart usually share a category (gas and diesel are both
  // bills), so they take fixed, well-separated ESP colors instead.
  var PAIR = ['#2c3254', '#b0645f', '#70ad8f'];
  var MUTE = '#6B6E78', INK = '#0E1320', GRID = '#ECECEC';
  var FONT = "'Public Sans', system-ui, sans-serif";
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fail(msg) { document.body.innerHTML = '<p class="error">' + msg + '</p>'; }

  var qs = new URLSearchParams(location.search);
  var ids = (qs.get('ids') || qs.get('id') || '').split(',').filter(Boolean);
  var payload = window.EMBED_DATA;
  if (!payload) return fail('No data loaded.');
  if (!ids.length) return fail('No chart chosen.');
  if (!window.Chart) return fail('Chart library failed to load.');

  var row = document.getElementById('app');
  row.className = 'row n' + ids.length;
  ids.forEach(function (id) {
    var card = document.createElement('div');
    card.className = 'card';
    row.appendChild(card);
    if (payload.charts[id]) renderCard(payload.charts[id], card);
    else card.innerHTML = '<p class="error">Unknown chart “' + id.replace(/[<&"]/g, '') + '”.</p>';
  });

  // Everything below draws one chart into its card, with its own downloads.
  function renderCard(chart, app) {
    var lines = chart.series;
    var first = lines[0];
    var units = first.units || '';
    var rate = units.indexOf('%') !== -1;   // isRateSeries
    var rebase = !!first.rebase;            // index series
    var multi = lines.length > 1;
    lines.forEach(function (s, i) {
      s.color = multi ? PAIR[i % PAIR.length] : (CATEGORY_COLOR[s.category] || '#2c3254');
      // The change is measured from the chart's first reading, or from the
      // first one on or after headline_from when the config sets it (a long
      // history on the chart, the post's own window in the headline).
      s.baseIdx = 0;
      if (chart.headline_from) {
        while (s.baseIdx < s.data.length - 1 && s.data[s.baseIdx].date < chart.headline_from) s.baseIdx++;
      }
      s.base = s.data[s.baseIdx].value;
      s.last = s.data[s.data.length - 1].value;
    });

    // Cadence from the median gap between readings: it decides how dates print.
    var gaps = [];
    for (var i = 1; i < first.data.length; i++) {
      gaps.push((Date.parse(first.data[i].date) - Date.parse(first.data[i - 1].date)) / 864e5);
    }
    gaps.sort(function (a, b) { return a - b; });
    var gap = gaps[Math.floor(gaps.length / 2)];
    var cadence = gap < 10 ? 'weekly' : gap < 45 ? 'monthly' : gap < 120 ? 'quarterly' : 'annual';

    // Dates print as precisely as the series is: weekly readings by day, so the
    // chart can name the same reading the post's text does.
    function fmtDate(d) {
      var y = +d.slice(0, 4), m = +d.slice(5, 7), day = +d.slice(8, 10);
      if (cadence === 'weekly') return MONTHS[m - 1] + ' ' + day + ', ' + y;
      if (cadence === 'monthly') return MONTHS[m - 1] + ' ' + y;
      if (cadence === 'quarterly') return 'Q' + Math.ceil(m / 3) + ' ' + y;
      return String(y);
    }
    function changeIn(b, v) { return rate ? v - b : (v / b - 1) * 100; }
    function fmtChange(v) {
      return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + (rate ? ' pp' : '%');
    }
    // Level formatting, after fmtVal in index.html; sub-dollar prices
    // (electricity per kWh) keep three decimals so monthly moves show.
    function fmtVal(v) {
      if (rate) return v.toFixed(2) + '%';
      if (units.indexOf('$') !== -1 || /gallon/i.test(units)) {
        if (Math.abs(v) >= 1000) return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
        if (Math.abs(v) < 1) return '$' + v.toFixed(3);
        return '$' + v.toFixed(2);
      }
      return v.toFixed(1);
    }

    var yMax = Math.max.apply(null, lines.map(function (s) {
      return Math.max.apply(null, s.data.map(function (p) { return Math.abs(p.value); }));
    }));
    var endDate = first.data[first.data.length - 1].date;
    var since = fmtDate(first.data[first.baseIdx].date);
    var unitLine = rebase ? '% change since ' + since + ' (price index)' : units;
    var sources = lines.map(function (s) {
      return {
        text: s.fred_id ? 'FRED · ' + s.fred_id : (s.source_note || 'Public data'),
        href: s.fred_id ? 'https://fred.stlouisfed.org/series/' + s.fred_id : s.source_url,
      };
    });
    // De-duplicate (two BLS lines can share a source note).
    sources = sources.filter(function (s, i) {
      return sources.findIndex(function (t) { return t.text === s.text; }) === i;
    });
    var sourceText = sources.map(function (s) { return s.text; }).join('; ');

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    app.appendChild(el('div', 'title', chart.title));
    app.appendChild(el('div', 'units', unitLine));
    if (!multi) {
      var head = el('div', 'headline', fmtChange(changeIn(first.base, first.last)));
      head.appendChild(el('span', null, 'since ' + since));
      app.appendChild(head);
    } else {
      // The key doubles as the headline: each line's name, color and change.
      var keys = el('div', 'keys');
      lines.forEach(function (s) {
        var k = el('div', 'key');
        var sw = el('i'); sw.style.background = s.color;
        k.appendChild(sw);
        k.appendChild(el('span', null, s.label));
        k.appendChild(el('b', null, fmtChange(changeIn(s.base, s.last))));
        keys.appendChild(k);
      });
      app.appendChild(keys);
      app.appendChild(el('div', 'since', 'since ' + since));
    }
    var wrap = el('div', 'chart');
    var canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', chart.title + ', ' + since + ' to ' + fmtDate(endDate) + ': ' +
      lines.map(function (s) { return s.label + ' ' + fmtChange(changeIn(s.base, s.last)); }).join(', '));
    wrap.appendChild(canvas);
    app.appendChild(wrap);
    var foot = el('div', 'foot');
    var src = el('div', 'source', 'Source: ');
    sources.forEach(function (s, i) {
      if (i) src.appendChild(document.createTextNode('; '));
      if (s.href) {
        var a = el('a', null, s.text);
        a.href = s.href; a.target = '_blank'; a.rel = 'noopener';
        src.appendChild(a);
      } else {
        src.appendChild(document.createTextNode(s.text));
      }
    });
    foot.appendChild(src);
    var btns = el('div', 'buttons');
    var csvBtn = el('button', null, 'Data (CSV)');
    var pngBtn = el('button', null, 'Image (PNG)');
    btns.appendChild(csvBtn); btns.appendChild(pngBtn);
    foot.appendChild(btns);
    app.appendChild(foot);

    // One config builder for the page chart and the PNG, so the two can't drift.
    // `s` scales type for the 1200px export.
    function chartConfig(sc, forExport) {
      return {
        type: 'line',
        data: { datasets: lines.map(function (s) {
          return {
            label: s.label,
            data: s.data.map(function (p) {
              return { x: p.date, y: rebase ? changeIn(s.base, p.value) : p.value };
            }),
            borderColor: s.color, backgroundColor: s.color,
            borderWidth: 2 * sc, tension: 0,
            pointRadius: s.data.length <= 30 ? 3 * sc : 0,
            pointHoverRadius: 4 * sc, pointHitRadius: 8,
          };
        }) },
        options: {
          responsive: !forExport, maintainAspectRatio: false,
          animation: false, devicePixelRatio: forExport ? 1 : undefined,
          interaction: { mode: 'index', intersect: false },
          layout: { padding: { top: 4 * sc, right: 6 * sc } },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: !forExport, displayColors: multi, boxWidth: 8, boxHeight: 8,
              backgroundColor: '#2c3254', titleColor: '#FFFFFF', bodyColor: '#FFFFFF',
              titleFont: { family: FONT, weight: '600', size: 12 },
              bodyFont: { family: FONT, size: 12 }, padding: 8,
              callbacks: {
                title: function (c) { return fmtDate(lines[c[0].datasetIndex].data[c[0].dataIndex].date); },
                label: function (c) {
                  var s = lines[c.datasetIndex], p = s.data[c.dataIndex];
                  var chg = fmtChange(changeIn(s.base, p.value));
                  if (multi) return s.label + ': ' + (rebase ? chg : fmtVal(p.value) + ' (' + chg + ')');
                  // Before the headline's base: no change line ("+3.2% since
                  // 2025" on a 2018 point would be nonsense), the level only.
                  if (c.dataIndex < s.baseIdx) return rebase ? chg + ' vs ' + since : fmtVal(p.value);
                  if (c.dataIndex === s.baseIdx) return rebase ? 'Base: ' + since : fmtVal(p.value);
                  return rebase ? chg + ' since ' + since : [fmtVal(p.value), chg + ' since ' + since];
                },
              },
            },
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: cadence === 'annual' ? 'year' : 'month' },
              grid: { display: false },
              border: { color: '#C9C9C9' },
              ticks: {
                color: MUTE, font: { family: FONT, size: 10 * sc }, maxRotation: 0,
                autoSkip: true, autoSkipPadding: 12, maxTicksLimit: forExport ? 8 : 4,
                callback: function (v) {
                  var d = new Date(v);
                  return cadence === 'annual' ? String(d.getFullYear())
                    : MONTHS[d.getMonth()] + " '" + String(d.getFullYear()).slice(2);
                },
              },
            },
            y: {
              grid: { color: GRID }, border: { display: false },
              ticks: {
                color: MUTE, font: { family: FONT, size: 10 * sc }, maxTicksLimit: 5,
                callback: function (v) {
                  if (rebase) return (v > 0 ? '+' : '') + v.toFixed(0) + '%';
                  if (rate) return v.toFixed(1) + '%';
                  if (units.indexOf('$') !== -1 || /gallon/i.test(units)) {
                    // One decimal rule per axis, from the data's size, so a tick
                    // at $10 doesn't print differently from one at $8.00.
                    return yMax >= 1000 ? '$' + Math.round(v).toLocaleString('en-US')
                      : '$' + v.toFixed(yMax < 50 ? 2 : 0);
                  }
                  return v.toFixed(0);
                },
              },
            },
          },
        },
      };
    }

    function download(blob, name) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    // CSV: the frozen points exactly as charted, one column per line (blank
    // where a line has no reading that date), provenance as # lines at the
    // bottom like the dashboard's downloadCSV.
    csvBtn.addEventListener('click', function () {
      var dates = {};
      lines.forEach(function (s) { s.data.forEach(function (p) { dates[p.date] = true; }); });
      var cols = lines.map(function (s) { return s.id; });
      if (rebase) cols = cols.concat(lines.map(function (s) { return s.id + '_pct_change_since_start'; }));
      var rows = Object.keys(dates).sort().map(function (d) {
        var vals = lines.map(function (s) {
          var p = s.data.find(function (q) { return q.date === d; });
          return p ? String(p.value) : '';
        });
        if (rebase) vals = vals.concat(lines.map(function (s) {
          var p = s.data.find(function (q) { return q.date === d; });
          return p ? changeIn(s.base, p.value).toFixed(2) : '';
        }));
        return [d].concat(vals).join(',');
      });
      var prov = lines.map(function (s) {
        return '# ' + s.id + ': ' + s.label + ', ' + units + ' — ' +
          (s.fred_id ? 'FRED ' + s.fred_id + ', https://fred.stlouisfed.org/series/' + s.fred_id
                     : (s.source_note || '') + (s.source_url ? ', ' + s.source_url : ''));
      }).join('\n') +
        '\n# Economic Security Project Affordability Dashboard, data as of ' + payload.vintage + '\n';
      var csv = 'date,' + cols.join(',') + '\n' + rows.join('\n') + '\n\n' + prov;
      download(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), chart.id + '.csv');
    });

    // PNG: redraw at a fixed 1200x675 rather than photographing the on-page
    // canvas, whose shape depends on the reader's column width.
    pngBtn.addEventListener('click', function () {
      var W = 1200, H = 675, pad = 48, sc = 1.6;
      var top = multi ? pad + 150 : pad + 130;
      var chartH = H - 70 - top;
      var host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + (W - 2 * pad) + 'px;height:' + chartH + 'px;';
      var off = document.createElement('canvas');
      off.width = W - 2 * pad; off.height = chartH;
      host.appendChild(off); document.body.appendChild(host);
      var tmp = new Chart(off, chartConfig(sc, true));

      var c = document.createElement('canvas');
      c.width = W; c.height = H;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillStyle = INK; ctx.font = '700 34px ' + FONT;
      ctx.fillText(chart.title, pad, pad + 26);
      ctx.fillStyle = MUTE; ctx.font = '400 18px ' + FONT;
      ctx.fillText(unitLine, pad, pad + 56);
      var range = 'since ' + since + ' (latest: ' + fmtDate(endDate) + ')';
      if (!multi) {
        var hl = fmtChange(changeIn(first.base, first.last));
        ctx.fillStyle = first.color === '#ebc382' ? INK : first.color; ctx.font = '700 40px ' + FONT;
        ctx.fillText(hl, pad, pad + 110);
        var hw = ctx.measureText(hl).width;
        ctx.fillStyle = MUTE; ctx.font = '400 18px ' + FONT;
        ctx.fillText(range, pad + hw + 12, pad + 110);
      } else {
        var x = pad;
        lines.forEach(function (s) {
          ctx.fillStyle = s.color; ctx.fillRect(x, pad + 92, 22, 5);
          x += 32;
          ctx.fillStyle = INK; ctx.font = '400 24px ' + FONT;
          ctx.fillText(s.label, x, pad + 102); x += ctx.measureText(s.label).width + 10;
          ctx.font = '700 30px ' + FONT;
          var t = fmtChange(changeIn(s.base, s.last));
          ctx.fillText(t, x, pad + 102); x += ctx.measureText(t).width + 40;
        });
        ctx.fillStyle = MUTE; ctx.font = '400 18px ' + FONT;
        ctx.fillText(range, pad, pad + 132);
      }
      ctx.drawImage(off, pad, top);
      // Two footer lines: a long source note (KFF, NY Fed) would collide with
      // the wordmark if they shared one.
      ctx.strokeStyle = '#E2E2E2'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad, H - 62); ctx.lineTo(W - pad, H - 62); ctx.stroke();
      ctx.fillStyle = MUTE; ctx.font = '600 13px ' + FONT;
      ctx.fillText('ECONOMIC SECURITY PROJECT · AFFORDABILITY DASHBOARD', pad, H - 38);
      ctx.font = '400 13px ' + FONT;
      ctx.fillText('Source: ' + sourceText + ' · data as of ' + payload.vintage, pad, H - 17);
      tmp.destroy(); document.body.removeChild(host);
      c.toBlob(function (b) { if (b) download(b, chart.id + '.png'); }, 'image/png');
    });

    function draw() { new Chart(canvas, chartConfig(1, false)); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw); else draw();
  }
})();
</script>
</body>
</html>
