<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Post embed test</title>
<style>
  /* Local stand-in for a WordPress post: a ~720px text column with one
     iframe per graphic, each holding its charts side by side.
     Open as embeds/embed_test.html?slug=<folder> over the static server
     (.claude/launch.json). The iframes carry the same sandbox as the
     snippets in embeds/<slug>/README.md; over file:// the sandbox is
     dropped, because a sandboxed frame can't load file:// scripts. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFDF2; font: 17px/1.6 Georgia, serif; color: #222; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  .cols { margin: 24px 0; }
  .cols p { font: 600 13px system-ui, sans-serif; color: #6B6E78; margin: 24px 0 8px; }
  iframe { width: 100%; height: 420px; border: 0; display: block; }
</style>
</head>
<body>
<main>
  <h1>Test post</h1>
  <p>Body text runs at the width of a typical blog column. The charts below are
  the frozen embeds for the slug in the query string.</p>
  <div class="cols" id="cols"></div>
  <p>More body text after the charts.</p>
</main>
<script>
  var qs = new URLSearchParams(location.search);
  var slug = qs.get('slug') || 'rising-cost-2026';
  // &nosandbox=1 drops the sandbox, for tools that can't see into a
  // sandboxed (opaque-origin) frame. Test the sandboxed default in a browser.
  var sandbox = location.protocol !== 'file:' && !qs.has('nosandbox');
  var s = document.createElement('script');
  s.src = slug + '/data.js';
  s.onload = function () {
    var host = document.getElementById('cols');
    var g = window.EMBED_DATA.graphics;
    Object.keys(g).forEach(function (name) {
      var h = document.createElement('p');
      h.textContent = name;
      host.appendChild(h);
      var f = document.createElement('iframe');
      if (sandbox) f.setAttribute('sandbox', 'allow-scripts allow-downloads allow-popups');
      f.title = name;
      f.src = slug + '/chart.html?ids=' + g[name].join(',');
      host.appendChild(f);
    });
  };
  document.head.appendChild(s);
</script>
</body>
</html>
