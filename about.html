<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About the Data — Economic Security Project's Affordability Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy: #2c3254;
    --red: #E04E39;
    --beige: #f4f2e4;
    --paper: #FFFDF2;
    --surface: #FFFFFF;   /* data panels only; see index.html's SURFACE */
    --ink: #0E1320;
    --mute: #6B6E78;
    --soft: #9A9CA3;
    --rule: rgba(44,50,84,.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Public Sans', system-ui, sans-serif;
    background: #0E1320; color: var(--ink);
  }
  /* Cream surround, white tables — the same split as the tracker (August 2026),
     so the two pages read as one site inside the ESP Resources template. */
  .stage { background: var(--paper); min-height: 100vh; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .serif { font-family: 'Public Sans', system-ui, sans-serif; }
  .display { font-family: 'Public Sans', system-ui, sans-serif; }

  .topbar {
    background: var(--navy); color: var(--paper);
    padding: 16px 56px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600;
  }
  .topbar a { color: var(--paper); text-decoration: none; border-bottom: 1px dotted rgba(244,242,228,.5); padding-bottom: 1px; }

  header.hero {
    background: var(--navy); color: var(--paper);
    padding: 56px 56px 48px;
  }
  .kicker {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 26px; font-weight: 600; color: var(--red); margin-bottom: 16px;
  }
  h1 {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 52px; line-height: 1.06; letter-spacing: -.02em; font-weight: 500;
    max-width: 900px; margin-bottom: 0;
  }

  main { padding: 44px 56px 64px; max-width: 1180px; }

  /* No "§01" section tags (What to Check #3) — headings are plain text. */
  h2 {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 27px; font-weight: 500; margin: 44px 0 6px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(44,50,84,.25);
  }
  h2:first-of-type { margin-top: 0; }
  /* Paragraphs run the full column width, matching the tables below them.
     A narrower measure read as text being cut off mid-sentence next to a
     full-bleed table, so the two are deliberately the same width. */
  p.lead { margin: 14px 0 18px; font-size: 15.5px; line-height: 1.65; max-width: none; }
  p.note { margin: 12px 0 18px; font-size: 13.5px; line-height: 1.65; color: var(--mute); max-width: none; }
  p.note b { color: var(--ink); font-weight: 600; }

  .table-wrap { overflow-x: auto; margin: 18px 0 8px; }
  table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--rule); font-size: 13.5px;
  }
  th {
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 700; color: var(--mute); text-align: left;
    padding: 10px 14px; border-bottom: 1px solid var(--rule);
    background: rgba(44,50,84,.045);
  }
  td { padding: 11px 14px; border-bottom: 1px solid rgba(44,50,84,.09); vertical-align: top; line-height: 1.5; }
  tr:last-child td { border-bottom: none; }
  td b { font-weight: 600; }
  td a { color: var(--navy); }
  /* The Updates column is plain text (Weekly / Monthly / Quarterly / Annual).
     It used to be a color-coded .freq badge; the colors read as a status
     signal that a publication cadence doesn't carry. Don't reintroduce it. */

  footer {
    padding: 22px 56px 48px;
    font-family: 'Public Sans', system-ui, sans-serif;
    font-size: 11px; color: var(--mute); letter-spacing: .08em; text-transform: uppercase;
    border-top: 1px solid rgba(44,50,84,.2); margin: 0 56px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding-left: 0; padding-right: 0;
  }
  .footer-wrap { padding: 0 56px 48px; }
  footer a { color: var(--mute); }

  @media (max-width: 720px) {
    .topbar, header.hero, main, .footer-wrap { padding-left: 20px; padding-right: 20px; }
    footer { margin: 0; }
    h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="topbar">
    <span>Economic Security Project</span>
    <a href="index.html">← Back to the dashboard</a>
  </div>

  <header class="hero">
    <div class="kicker">Economic Security Project's Affordability Dashboard</div>
    <h1>About the data.</h1>
  </header>

  <main></main>
  <script src="assets/about_content.js"></script>
  <script>
    // The sources & methods content lives in assets/about_content.js (one
    // source of truth, shared with index.html's in-app About view).
    document.querySelector('main').innerHTML = window.ABOUT_CONTENT || '';
  </script>

  <div class="footer-wrap">
    <footer>
      <span><a href="index.html">← Back to the dashboard</a></span>
      <span>Data: FRED · BLS · Census · FHFA · Zillow · Freddie Mac · EIA · NY Fed · KFF · CCAoA · Urban Institute</span>
    </footer>
  </div>

</div>

<script>
  // The tracker forwards its state hash (#view=...&state=...) when linking
  // here, so the back links can return the reader to the view they left.
  (function () {
    var h = window.location.hash;
    if (!h) return;
    document.querySelectorAll('a[href="index.html"]').forEach(function (a) {
      a.href = 'index.html' + h;
    });
  })();
</script>
</body>
</html>
